<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理者總表 — 奶奶照護日誌</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="care-tasks.js"></script>
    <style>
        body { background: linear-gradient(180deg, #f0f9ff 0%, #ffffff 45%, #fff1f2 100%); }
        .animate-spin-slow { animation: spin 3s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @media print { .no-print { display: none !important; } body { background: #fff; } }
    </style>
</head>
<body class="text-gray-800 min-h-screen pb-12 font-sans">

    <div class="max-w-3xl mx-auto px-4 pt-5">

        <div class="text-center mb-3">
            <a href="index.html"><h1 class="text-xl font-black text-sky-600 tracking-wide">🗂️ 管理者總表</h1></a>
            <p class="text-[11px] text-gray-400 font-bold mt-0.5">使用者 U1／U2／U3 合併檢視（點標題回日誌）</p>
        </div>

        <!-- 快速入口 -->
        <div class="no-print grid grid-cols-3 gap-2 mb-3">
            <a href="index.html?user=1" class="bg-rose-50 border border-rose-200 text-rose-600 text-center py-2 rounded-2xl text-[11px] font-black active:scale-95">👤 以 U1 視角開啟</a>
            <a href="index.html?user=2" class="bg-rose-50 border border-rose-200 text-rose-600 text-center py-2 rounded-2xl text-[11px] font-black active:scale-95">👤 以 U2 視角開啟</a>
            <a href="index.html?user=3" class="bg-rose-50 border border-rose-200 text-rose-600 text-center py-2 rounded-2xl text-[11px] font-black active:scale-95">👤 以 U3 視角開啟</a>
        </div>
        <div class="no-print grid grid-cols-2 gap-2 mb-3">
            <a href="https://lookerstudio.google.com/reporting/create?ds.ds0.connector=googleSheets&ds.ds0.spreadsheetId=1K2kmt5iqhaZ6zIl6sAXny-vjx8JnJCL2D-t5W3Ab9Wk" target="_blank" class="bg-purple-50 border border-purple-200 text-purple-700 text-center py-2 rounded-2xl text-[11px] font-black active:scale-95">📈 進階分析：週趨勢／達成率（Looker Studio）</a>
            <a id="sheet-link" href="https://docs.google.com/spreadsheets/d/1K2kmt5iqhaZ6zIl6sAXny-vjx8JnJCL2D-t5W3Ab9Wk/edit" target="_blank" class="bg-green-50 border border-green-200 text-green-700 text-center py-2 rounded-2xl text-[11px] font-black active:scale-95">📊 原始試算表（月總覽／樞紐）</a>
        </div>

        <!-- 進度格（病患層級，三人共同達成） -->
        <div class="bg-white rounded-3xl p-3 shadow-sm border-2 border-sky-100 mb-3 overflow-x-auto">
            <div id="progress-grid" class="text-center text-[10px] text-gray-300 font-bold">⏳</div>
        </div>

        <!-- 日期 + 使用者篩選 -->
        <div class="no-print bg-white rounded-3xl p-3 shadow-sm border border-gray-100 mb-3 space-y-2">
            <div class="flex items-center gap-2">
                <button type="button" onclick="shiftDate(-1)" class="bg-gray-100 text-gray-600 px-3 py-2 rounded-2xl text-sm font-black active:scale-95">◀</button>
                <input id="report-date" type="date" class="flex-1 bg-gray-50 border-0 rounded-2xl py-2 px-3 text-sm font-bold text-gray-700 text-center" onchange="loadData()">
                <button type="button" onclick="shiftDate(1)" class="bg-gray-100 text-gray-600 px-3 py-2 rounded-2xl text-sm font-black active:scale-95">▶</button>
            </div>
            <div id="user-filter" class="flex gap-1.5 justify-center"></div>
        </div>

        <div id="loading" class="text-center py-6 text-gray-400 text-sm font-bold hidden"><span class="inline-block animate-spin-slow">🔄</span> 讀取中…</div>

        <div id="admin-container"></div>
    </div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycby-3Q--z4t03yOtgtMpkbhYccmxD9dqvmrqQdX4sg4vZNBfjgyuKYuL6HZuHkro7p0o/exec";

const CAT_SHORT = {
    '飲水量':'飲水', '服藥飲水':'服藥', '營養飲品':'營養', '進食':'進食',
    '尿液':'尿液', '排便':'排便',
    '雙手舉水瓶':'舉水瓶', '腳底板抬壓':'抬腳壓', '膝蓋彎伸':'膝彎伸', '站立':'站立'
};
function catShort(cat){
    if (CAT_SHORT[cat]) return CAT_SHORT[cat];
    if (cat && cat.indexOf('血壓/心跳') === 0) return '血壓' + (cat.includes('(早)') ? '(早)' : cat.includes('(晚)') ? '(晚)' : '');
    return cat;
}
function unitOf(cat){
    if (['排便','站立'].includes(cat)) return '次';
    if (['雙手舉水瓶','腳底板抬壓','膝蓋彎伸'].includes(cat)) return '組';
    if (cat && cat.indexOf('血壓') === 0) return '';
    return 'cc';
}

let FILTER = 'all';   // all | 1 | 2 | 3 | none
let cachedRecords = [];

function renderFilter(counts){
    const defs = [['1','👤U1'],['2','👤U2'],['3','👤U3'],['all','👤ALL'],['none','未標記']];
    document.getElementById('user-filter').innerHTML = defs.map(([k,lbl]) => {
        const c = counts ? (counts[k] || 0) : 0;
        return `<button type="button" onclick="setFilter('${k}')" class="px-3 py-1.5 rounded-full text-[11px] font-black border ${FILTER===k?'bg-sky-500 text-white border-sky-500':'bg-white text-gray-500 border-gray-200'}">${lbl}${counts?` <span class="opacity-70">${c}</span>`:''}</button>`;
    }).join('');
}
function setFilter(k){ FILTER = k; render(); }

function shiftDate(days){
    const inp = document.getElementById('report-date');
    const d = new Date(inp.value + 'T00:00:00');
    d.setDate(d.getDate() + days);
    inp.value = new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().split('T')[0];
    loadData();
}

function loadData(){
    const date = document.getElementById('report-date').value;
    const url = new URL(location); url.searchParams.set('date', date); history.replaceState(null,'',url);
    document.getElementById('loading').classList.remove('hidden');
    fetch(`${GAS_URL}?date=${date}&t=${Date.now()}`, { cache:'no-store' })
        .then(r => r.json())
        .then(data => { cachedRecords = (data.records||[]).filter(r => r.status !== '無效'); render(); })
        .catch(() => { document.getElementById('admin-container').innerHTML =
            `<div class="text-center py-6 text-red-500 text-sm font-bold bg-white rounded-3xl border border-red-100">⚠️ 同步失敗，請檢查網路</div>`; })
        .finally(() => document.getElementById('loading').classList.add('hidden'));
}

function render(){
    const date = document.getElementById('report-date').value;
    const records = cachedRecords;

    // 進度格＝病患層級（不分記錄者）
    const { tasks, lateRecIds } = careComputeTasks(records, date);
    careRenderGrid(document.getElementById('progress-grid'), tasks, 'zh');

    // 各使用者筆數
    const counts = { all: records.length, '1':0, '2':0, '3':0, 'A':0, none:0 };
    records.forEach(r => { const u = careUserOfNote(r.note); counts[u || 'none']++; });
    renderFilter(counts);

    const show = records.filter(r => {
        const u = careUserOfNote(r.note);
        if (FILTER === 'all') return true;
        if (FILTER === 'none') return !u;
        return u === FILTER;
    });

    let bodyRows = '';
    CARE_SLOTS.forEach(slot => {
        const recs = show
            .filter(r => r.time >= slot.start && (slot.end === '24:00' || r.time < slot.end))
            .sort((a,b) => a.time.localeCompare(b.time));
        const missed = FILTER === 'all' ? tasks.filter(t => t.slot === slot.key && t.state === 'missed') : [];
        const n = recs.length + missed.length;
        if (n === 0) return;

        const slotCell = `<td rowspan="${n}" class="align-top py-1.5 px-2 text-[10px] font-black text-gray-500 bg-gray-50/80 whitespace-nowrap border-r border-gray-100">${slot.zh}<div class="text-[8px] text-gray-300">${slot.start}-${slot.end}</div></td>`;
        let first = true;
        recs.forEach(r => {
            const late = lateRecIds.has(r.recordId);
            const c = late ? 'text-amber-600' : 'text-gray-700';
            const u = careUserOfNote(r.note);
            const note = careNoteDisplay(r.note, 'zh');
            const uColor = { '1':'bg-rose-100 text-rose-600', '2':'bg-sky-100 text-sky-600', '3':'bg-green-100 text-green-700', 'A':'bg-purple-100 text-purple-600' }[u] || 'bg-gray-100 text-gray-400';
            bodyRows += `<tr class="border-b border-gray-50 ${late?'bg-amber-50/60':''}">
                ${first ? slotCell : ''}
                <td class="py-1.5 px-2 text-[11px] font-black whitespace-nowrap ${c}">${r.time}${late?'🟧':''}</td>
                <td class="py-1.5 px-2"><span class="text-[9px] font-black px-1.5 py-0.5 rounded-md ${uColor}">${u?'U'+u:'—'}</span></td>
                <td class="py-1.5 px-2 text-[11px] font-bold ${c}">${catShort(r.category)} ${r.amount !== '' && r.amount !== undefined ? r.amount : ''}${unitOf(r.category)}</td>
                <td class="py-1.5 px-2 text-[10px] ${late ? 'text-amber-500 font-bold' : 'text-gray-400'}">${late ? '補齊' + (note?'｜'+note:'') : (note || '')}</td>
            </tr>`;
            first = false;
        });
        missed.forEach(t => {
            bodyRows += `<tr class="border-b border-gray-50 bg-red-50/60">
                ${first ? slotCell : ''}
                <td class="py-1.5 px-2 text-[12px] font-black text-red-600">XX</td>
                <td class="py-1.5 px-2"><span class="text-[9px] font-black px-1.5 py-0.5 rounded-md bg-red-100 text-red-500">—</span></td>
                <td class="py-1.5 px-2 text-[11px] font-black text-red-600">${t.full_zh}</td>
                <td class="py-1.5 px-2 text-[10px] font-bold text-red-400">未完成</td>
            </tr>`;
            first = false;
        });
    });

    const done = tasks.filter(t=>t.state==='done').length,
          late = tasks.filter(t=>t.state==='late').length,
          miss = tasks.filter(t=>t.state==='missed').length;

    document.getElementById('admin-container').innerHTML = `
    <div class="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden">
        <div class="px-3 py-2 text-[10px] font-black text-gray-400 border-b border-gray-100 flex justify-between">
            <span>${date}${FILTER!=='all' ? '（篩選：' + (FILTER==='none'?'未標記':'U'+FILTER) + '）' : ''}</span>
            <span><span class="text-green-600">✓${done}</span>　<span class="text-amber-500">補${late}</span>　<span class="text-red-600">✕${miss}</span>　共${show.length}筆</span>
        </div>
        <table class="w-full text-left">
            <thead><tr class="text-[9px] text-gray-400 font-black border-b border-gray-100 bg-gray-50/50">
                <th class="py-1 px-2">時間段</th>
                <th class="py-1 px-2">記錄時間</th>
                <th class="py-1 px-2">記錄者</th>
                <th class="py-1 px-2">記錄事件</th>
                <th class="py-1 px-2">備註</th>
            </tr></thead>
            <tbody>${bodyRows || `<tr><td colspan="5" class="py-4 text-center text-[11px] text-gray-300">📭 無符合紀錄</td></tr>`}</tbody>
        </table>
    </div>
    <p class="text-[10px] text-gray-300 font-bold text-center mt-3">舊紀錄無 👤 標記者列於「未標記」。趨勢分析可用試算表樞紐或免費 Looker Studio 連接原始試算表。</p>`;
}

(function init(){
    // 管理者密碼閘門（同裝置一次授權，關閉瀏覽器後重問）
    if (sessionStorage.getItem('care_admin_ok') !== '1') {
        if (!careAskPin('管理者總表需要密碼 / Perlu PIN admin')) { location.href = 'index.html'; return; }
        sessionStorage.setItem('care_admin_ok', '1');
    }
    const p = new URLSearchParams(location.search).get('date');
    document.getElementById('report-date').value = (p && /^\d{4}-\d{2}-\d{2}$/.test(p)) ? p : careTodayStr();
    renderFilter(null);
    loadData();
})();
</script>
</body>
</html>
