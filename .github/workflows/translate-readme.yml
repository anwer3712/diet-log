name: Generate translated READMEs

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  translate:
    name: Translate README and open PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Run translation script
        run: node ./scripts/translate-all.js

      - name: Create pull request with translations
        uses: peter-evans/create-pull-request@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(i18n): add translated READMEs"
          branch: translate/readmes-auto
          title: "chore(i18n): add translated README files"
          body: |
            This PR adds translated README files generated from the main README.md.
            Languages included: zh-CN, es, en, ar, hi, pt-BR, bn, ru, ja, pa-Arab, vi, tr, mr, te, ms, id, ko, fr, ta, de, ur
          labels: i18n, autogenerated
