name: Auto-translate README

on:
  push:
    paths:
      - 'README.md'
      - 'docs/translations/**'
  schedule:
    - cron: '0 2 * * 0'  # weekly (UTC)

permissions:
  contents: write

jobs:
  translate-and-push:
    runs-on: ubuntu-latest
    concurrency:
      group: auto-translate-readme
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run auto-translate script
        run: |
          python scripts/auto_translate.py
        env:
          TRANSLATE_API_URL: ${{ secrets.TRANSLATE_API_URL }}
          TRANSLATE_API_KEY: ${{ secrets.TRANSLATE_API_KEY }}
          SOURCE_FILE: README.md
          TARGET_DIR: docs/translations
          TARGET_LANGS: ''
          OVERWRITE: 'false'

      - name: Commit & push changes if any
        run: |
          git status --porcelain
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/translations || true
            git commit -m "chore: update automated translations" || echo "no changes to commit"
            git push origin HEAD
          else
            echo "No translation changes"
          fi
