<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>奶奶日誌 — 兒童版 / Catatan Nenek — Anak</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="care-tasks.js?v=12"></script>
    <style>
        /* ============================================================
         * 兒童＋先天遠視設計原則：超大字、白底高對比、粗實心框、
         * 引導一律用「粗框＋強光暈」動態（禁用淡色/細閃動，他看不到）
         * 主色改為深青 teal（原 sky 藍停用）；紅色只留給緊急警示
         * ============================================================ */
        :root {
            --ink: #111827;
            --line: #d1d5db;
            --accent: #0f766e;        /* 深青：選取/主要動作 */
            --accent-soft: #ccfbf1;
            --guide: #6d28d9;         /* 深紫：目前步驟引導（與大人版一致） */
            --guide2: #a855f7;
            --danger: #b91c1c;        /* 深紅：緊急專用 */
        }
        body { background: #ffffff; color: var(--ink); font-size: 22px; }

        /* 步驟卡：粗框＋左上超大數字徽章 */
        .step { position: relative; border: 4px solid var(--line); border-radius: 1.75rem; }
        .stepnum {
            position: absolute; top: -1.35rem; left: -0.4rem;
            width: 3.6rem; height: 3.6rem; border-radius: 9999px;
            background: #111827; color: #fff;
            font-size: 2.1rem; font-weight: 900; line-height: 1;
            display: flex; align-items: center; justify-content: center;
            border: 4px solid #fff; box-shadow: 0 3px 10px rgba(0,0,0,.25);
            z-index: 10;
        }
        /* 目前步驟：深紫粗框動態引導（取代 DI SINI 文字）；加粗 6px＋大光暈，遠視兒童看得清楚 */
        .step.now { border-color: var(--guide); border-width: 6px; animation: guide-step 1.1s infinite ease-in-out; }
        .step.now .stepnum { background: var(--guide); animation: badge-pulse 1.1s infinite ease-in-out; }
        @keyframes guide-step {
            0%, 100% { border-color: var(--guide);  box-shadow: 0 0 0 4px rgba(109,40,217,.5); }
            50%      { border-color: var(--guide2); box-shadow: 0 0 0 14px rgba(109,40,217,.32); }
        }
        @keyframes badge-pulse {
            0%, 100% { transform: scale(1); }
            50%      { transform: scale(1.12); }
        }

        /* 藍色閃動邊框：紫色大框標示「目前步驟」，藍色閃框標示「現在要填的欄位」
         * （遠視友善：粗框＋強光暈，不用淡色細閃） */
        .guide-flash { border-color: #0284c7 !important; border-radius: 1rem; animation: guide-flash 1.1s infinite ease-in-out; }
        @keyframes guide-flash {
            0%, 100% { box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.9); }
            50%      { box-shadow: 0 0 20px 9px rgba(2, 132, 199, 0.45); }
        }

        /* 出現動畫：步驟/彈窗滑入 */
        .enter { animation: pop-in .35s cubic-bezier(.2, .9, .3, 1.3); }
        @keyframes pop-in {
            from { opacity: 0; transform: translateY(14px) scale(.96); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* 緊急警示動態：深紅強光暈＋進場搖晃，務必醒目 */
        .alert-banner { animation: shake .5s ease 2, glow-red 1.2s infinite ease-in-out; }
        .glow-red { animation: glow-red 1.2s infinite ease-in-out; }
        @keyframes glow-red {
            0%, 100% { box-shadow: 0 0 0 0 rgba(153, 27, 27, .9); }
            50%      { box-shadow: 0 0 26px 10px rgba(153, 27, 27, .5); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-7px); } 40% { transform: translateX(7px); }
            60% { transform: translateX(-5px); } 80% { transform: translateX(5px); }
        }
        .bounce-big { display: inline-block; animation: bounce-big 1s infinite; }
        @keyframes bounce-big {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-12px); }
        }
        .modal-card { animation: pop-in .3s cubic-bezier(.2, .9, .3, 1.3); }
        .modal-card.danger { animation: pop-in .3s cubic-bezier(.2, .9, .3, 1.3), shake .5s ease .3s 2, glow-red 1.2s infinite ease-in-out .9s; }

        /* 按鈕通用 */
        .bigbtn { min-height: 64px; transition: transform .12s ease, background-color .2s, color .2s, border-color .2s; }
        .bigbtn:active { transform: scale(.95); }
        .choice { border: 4px solid #1f2937; border-radius: 1.25rem; font-weight: 900; background: #fff; }
        .choice.selected { background: var(--accent); border-color: var(--accent); color: #fff; }
        .chip.selected { background: var(--accent); border-color: var(--accent); color: #fff; }
        .ringed { box-shadow: 0 0 0 6px var(--accent); border-color: var(--accent) !important; }

        .animate-spin-slow { animation: spin 3s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        #toast { transition: opacity .3s, transform .3s; transform: translate(-50%, 20px); }
        #toast.show { opacity: 1; transform: translate(-50%, 0); }

        @media (prefers-reduced-motion: reduce) {
            * { animation: none !important; transition: none !important; }
        }
    </style>
</head>
<body class="min-h-screen pb-16 font-sans">
    <div class="max-w-md mx-auto px-3 pt-4 space-y-8">

        <!-- 頂部：標題本身就是回大人版的連結（不另設按鈕，畫面乾淨） -->
        <header class="space-y-2">
            <div class="flex items-center justify-between gap-2">
                <a href="index.html" class="flex-1 min-w-0 active:opacity-60">
                    <h1 class="text-3xl font-black truncate">👵 <span data-t="title"></span> <span class="text-lg align-middle text-gray-400">👤›</span></h1>
                </a>
                <div id="lang-switch" class="flex gap-1 shrink-0"></div>
            </div>
            <!-- 每個項目各自顯示 🎯今日目標 / ✅目前已達（水/尿/便＋四項復健） -->
            <div class="flex items-center justify-center gap-2 text-base font-black" style="color: var(--accent)">
                <span>🎯<span data-t="goalLbl"></span> ｜ ✅<span data-t="doneLbl"></span></span>
                <span id="sync-icon" class="text-base">🔄</span>
            </div>
            <div id="goal-strips" class="space-y-1 text-left"></div>
            <div id="warn-box" class="space-y-2 text-center"></div>
            <!-- 兒童改4：床欄安全警示（與成人版同規則，兒童大字🚨常駐） -->
            <div id="anak-bedrail" class="border-4 rounded-3xl p-2.5 text-center mt-1" style="border-color: var(--danger); background:#fff1f2; color: var(--danger)">
                <p class="text-xl font-black leading-snug"><span class="bounce-big">🚨</span> <span id="anak-bedrail-zh">床圍欄放下時，照顧者不得離開病患 1 公尺</span></p>
                <p id="anak-bedrail-id" class="text-sm font-bold leading-snug">Saat pagar tempat tidur diturunkan, jangan tinggalkan pasien lebih dari 1 meter</p>
            </div>
        </header>

        <!-- 一、日期＋時間（12 小時制：☀️ 白天 06–18、🌙 夜晚 18–06） -->
        <section id="step1" class="step now bg-white p-4 pt-6 space-y-3">
            <div class="stepnum">1</div>
            <h2 class="text-2xl font-black text-center">📅 <span data-t="s1"></span></h2>
            <div class="relative">
                <div id="date-display" class="w-full bg-white border-4 border-gray-800 rounded-2xl py-3 px-3 text-3xl font-black text-center"></div>
                <input id="input-date" type="date" class="absolute inset-0 w-full h-full opacity-0">
            </div>
            <div class="flex gap-2 items-center justify-center">
                <span id="daynight" class="text-5xl shrink-0">☀️</span>
                <select id="sel-hour" class="flex-1 min-w-0 bg-white border-4 border-gray-800 rounded-2xl py-3 text-3xl font-black text-center"></select>
                <span class="text-3xl font-black">:</span>
                <select id="sel-min" class="flex-1 min-w-0 bg-white border-4 border-gray-800 rounded-2xl py-3 text-3xl font-black text-center"></select>
            </div>
            <button id="step1-ok" type="button" onclick="okStep1()" class="bigbtn w-full text-white rounded-2xl text-3xl font-black py-3" style="background: var(--accent)" data-t="ok"></button>
        </section>

        <!-- 二、四大類（大圖示優先，字最少） -->
        <section id="step2" class="step bg-white p-4 pt-6 space-y-3 hidden">
            <div class="stepnum">2</div>
            <h2 class="text-2xl font-black text-center">👇 <span data-t="s2"></span></h2>
            <div id="type-grid" class="grid grid-cols-2 gap-3">
                <button type="button" onclick="pickType('makan')"   id="type-makan"   class="bigbtn type-btn choice py-4"><span class="block text-5xl leading-none mb-1">🍚🥤</span><span class="text-xl" data-t="tMakan"></span></button>
                <button type="button" onclick="pickType('keluar')"  id="type-keluar"  class="bigbtn type-btn choice py-4"><span class="block text-5xl leading-none mb-1">🚽💩</span><span class="text-xl" data-t="tKeluar"></span></button>
                <button type="button" onclick="pickType('latihan')" id="type-latihan" class="bigbtn type-btn choice py-4"><span class="block text-5xl leading-none mb-1">💪</span><span class="text-xl" data-t="tLatihan"></span></button>
                <button type="button" onclick="pickType('tensi')"   id="type-tensi"   class="bigbtn type-btn choice py-4"><span class="block text-5xl leading-none mb-1">❤️</span><span class="text-xl" data-t="tTensi"></span></button>
            </div>
            <button id="step2-ok" type="button" onclick="confirmStep2()" class="bigbtn w-full text-white rounded-2xl text-3xl font-black py-3 hidden" style="background: var(--accent)" data-t="ok"></button>
        </section>

        <!-- 三、細項 -->
        <section id="step2b" class="step bg-white p-4 pt-6 space-y-3 hidden">
            <div class="stepnum">3</div>
            <h2 class="text-2xl font-black text-center">🤔 <span data-t="s3"></span></h2>

            <!-- a. 吃進去的 -->
            <div id="panel-makan" class="space-y-3 hidden">
                <div id="item-grid-makan" class="grid grid-cols-2 gap-3">
                    <button type="button" onclick="pickItem('air')"  id="item-air"  class="bigbtn item-btn choice py-3"><span class="block text-5xl leading-none mb-1">💧</span><span class="text-lg" data-t="iAir"></span></button>
                    <button type="button" onclick="pickItem('obat')" id="item-obat" class="bigbtn item-btn choice py-3"><span class="block text-5xl leading-none mb-1">💊</span><span class="text-lg" data-t="iObat"></span></button>
                    <button type="button" onclick="pickItem('susu')" id="item-susu" class="bigbtn item-btn choice py-3"><span class="block text-5xl leading-none mb-1">🥛</span><span class="text-lg" data-t="iSusu"></span></button>
                    <button type="button" onclick="pickItem('food')" id="item-food" class="bigbtn item-btn choice py-3"><span class="block text-5xl leading-none mb-1">🥣</span><span class="text-lg" data-t="iFood"></span></button>
                </div>
                <div id="quick-susu" class="grid grid-cols-2 gap-3 hidden">
                    <button type="button" onclick="setAmount(120)" class="bigbtn rounded-2xl border-4 font-black text-xl py-3" style="border-color: var(--accent); background: var(--accent-soft)" data-t="halfCan"></button>
                    <button type="button" onclick="setAmount(240)" class="bigbtn rounded-2xl border-4 font-black text-xl py-3" style="border-color: var(--accent); background: var(--accent-soft)" data-t="fullCan"></button>
                </div>
                <!-- 湯湯水水（羅馬拼音）：buding 預設 135cc；其餘由照顧者填 cc -->
                <div id="quick-food" class="hidden space-y-2">
                    <p class="text-lg font-black text-center text-gray-600" data-t="foodMeasure"></p>
                    <img src="math.jpg" alt="" loading="lazy" class="w-full rounded-2xl border">
                    <div id="food-grid" class="grid grid-cols-2 gap-2"></div>
                    <input id="food-other" type="text" class="w-full border-4 border-gray-800 rounded-2xl py-3 px-3 text-2xl font-black">
                    <!-- 胃口（必選）：好/普通/差 -->
                    <p class="text-2xl font-black">😋 <span data-t="appTitle"></span></p>
                    <div id="appetite-grid" class="grid grid-cols-3 gap-2">
                        <button type="button" data-app="好"   onclick="pickAppetite('好')"   class="app-btn chip bigbtn rounded-2xl border-4 border-gray-800 font-black text-xl py-3" data-t="aGood"></button>
                        <button type="button" data-app="普通" onclick="pickAppetite('普通')" class="app-btn chip bigbtn rounded-2xl border-4 border-gray-800 font-black text-xl py-3" data-t="aNormal"></button>
                        <button type="button" data-app="差"   onclick="pickAppetite('差')"   class="app-btn chip bigbtn rounded-2xl border-4 border-gray-800 font-black text-xl py-3" data-t="aPoor"></button>
                    </div>
                </div>
                <div id="amount-row">
                    <p class="text-2xl font-black" data-t="howMuch"></p>
                    <div class="flex items-center gap-2">
                        <input id="input-amount" type="number" min="1" class="flex-1 w-full border-4 border-gray-800 rounded-2xl py-3 px-3 text-4xl font-black text-center" placeholder="0">
                        <span class="text-3xl font-black">cc</span>
                    </div>
                </div>
            </div>

            <!-- b. 排出來的（尿液改用 🚽，與飲水 💧 區隔） -->
            <div id="panel-keluar" class="space-y-3 hidden">
                <div id="item-grid-keluar" class="grid grid-cols-2 gap-3">
                    <button type="button" onclick="pickItem('pipis')" id="item-pipis" class="bigbtn item-btn choice py-3"><span class="block text-5xl leading-none mb-1">🚽</span><span class="text-xl" data-t="iPipis"></span></button>
                    <button type="button" onclick="pickItem('pup')"   id="item-pup"   class="bigbtn item-btn choice py-3"><span class="block text-5xl leading-none mb-1">💩</span><span class="text-xl" data-t="iPup"></span></button>
                </div>
                <div id="pipis-extra" class="hidden space-y-2">
                    <div id="pipis-amount-row" class="space-y-2">
                        <p class="text-2xl font-black" data-t="howMuch"></p>
                        <div class="flex items-center gap-2">
                            <input id="pipis-amount" type="number" min="1" class="flex-1 w-full border-4 border-gray-800 rounded-2xl py-3 px-3 text-4xl font-black text-center" placeholder="0">
                            <span class="text-3xl font-black">cc</span>
                        </div>
                    </div>
                    <p class="text-2xl font-black">🎨 <span data-t="color"></span></p>
                    <div id="color-grid" class="grid grid-cols-3 gap-2">
                        <button type="button" onclick="pickColor(this,'淡紅色 / Merah Muda')"   class="color-btn bigbtn rounded-2xl border-4 border-gray-800 font-black text-lg py-3" style="background:#fda4af" data-t="cPink"></button>
                        <button type="button" onclick="pickColor(this,'深黃色 / Kuning Tua')"   class="color-btn bigbtn rounded-2xl border-4 border-gray-800 font-black text-lg py-3" style="background:#f59e0b" data-t="cDark"></button>
                        <button type="button" onclick="pickColor(this,'正常淺黃 / Kuning Muda')" class="color-btn bigbtn rounded-2xl border-4 border-gray-800 font-black text-lg py-3" style="background:#fde68a" data-t="cLight"></button>
                    </div>
                    <!-- 當日利尿藥物（可選，預設鎖定沿用前一次，管理者 PIN 解鎖才能改）：無 / 利尿藥物（輔助） / 利尿藥物 -->
                    <p class="text-2xl font-black">💊 <span data-t="umed"></span> <span class="text-base text-gray-500" data-t="opt"></span> <span id="umed-lock" class="text-xl">🔒</span></p>
                    <div id="umed-grid" class="grid grid-cols-3 gap-2 opacity-60" onclick="tryUnlockMed()">
                        <button type="button" data-med=""     onclick="pickUmed('')"     class="umed-btn chip bigbtn rounded-2xl border-4 border-gray-800 font-black text-lg py-3" data-t="mNone"></button>
                        <button type="button" data-med="aux"  onclick="pickUmed('aux')"  class="umed-btn chip bigbtn rounded-2xl border-4 border-gray-800 font-black text-base py-3 leading-tight" data-t="mAux"></button>
                        <button type="button" data-med="full" onclick="pickUmed('full')" class="umed-btn chip bigbtn rounded-2xl border-4 border-gray-800 font-black text-base py-3 leading-tight" data-t="mFull"></button>
                    </div>
                </div>
                <div id="pup-extra" class="hidden space-y-2">
                    <p class="text-2xl font-black" data-t="pupHow"></p>
                    <div id="status-grid" class="grid grid-cols-3 gap-2">
                        <button type="button" onclick="pickStatus(this,'稀便 / feses encer')"        class="status-btn bigbtn rounded-2xl border-4 border-gray-800 bg-orange-100 font-black text-xl py-3" data-t="pEncer"></button>
                        <button type="button" onclick="pickStatus(this,'大便乾硬 / Kering dan keras')" class="status-btn bigbtn rounded-2xl border-4 border-gray-800 bg-amber-100 font-black text-xl py-3" data-t="pKeras"></button>
                        <button type="button" onclick="pickStatus(this,'正常 / Normal')"             class="status-btn bigbtn rounded-2xl border-4 border-gray-800 bg-green-100 font-black text-xl py-3" data-t="pNormal"></button>
                    </div>
                    <p class="text-2xl font-black" data-t="glis"></p>
                    <div id="glis-grid" class="grid grid-cols-2 gap-2">
                        <button type="button" onclick="pickGliserin(this,true)"  class="glis-btn bigbtn rounded-2xl border-4 border-gray-800 font-black text-2xl py-3" data-t="yes"></button>
                        <button type="button" onclick="pickGliserin(this,false)" class="glis-btn bigbtn rounded-2xl border-4 border-gray-800 font-black text-2xl py-3" data-t="no"></button>
                    </div>
                    <!-- 當日利便藥物（可選，預設鎖定沿用前一次，管理者 PIN 解鎖才能改）：無 / 1顆 / 2顆 -->
                    <p class="text-2xl font-black">💊 <span data-t="lax"></span> <span class="text-base text-gray-500" data-t="opt"></span> <span id="lax-lock" class="text-xl">🔒</span></p>
                    <div id="lax-grid" class="grid grid-cols-3 gap-2 opacity-60" onclick="tryUnlockMed()">
                        <button type="button" data-lax="0" onclick="pickLax(0)" class="lax-btn chip bigbtn rounded-2xl border-4 border-gray-800 font-black text-lg py-3" data-t="mNone"></button>
                        <button type="button" data-lax="1" onclick="pickLax(1)" class="lax-btn chip bigbtn rounded-2xl border-4 border-gray-800 font-black text-lg py-3">1<span class="block text-sm leading-none" data-t="pill"></span></button>
                        <button type="button" data-lax="2" onclick="pickLax(2)" class="lax-btn chip bigbtn rounded-2xl border-4 border-gray-800 font-black text-lg py-3">2<span class="block text-sm leading-none" data-t="pill"></span></button>
                    </div>
                </div>
            </div>

            <!-- c. 運動（實照＋圖示，做完填次數） -->
            <div id="panel-latihan" class="space-y-3 hidden">
                <div id="item-grid-latihan" class="grid grid-cols-2 gap-3">
                    <button type="button" onclick="pickItem('kaki')"   id="item-kaki"   class="bigbtn item-btn choice p-2 pb-3"><img src="rehab-img/legraise-1.jpg"  loading="lazy" alt="" class="w-full h-24 object-cover rounded-xl mb-1 pointer-events-none"><span class="text-3xl align-middle">🦵</span> <span class="text-lg" data-t="iKaki"></span></button>
                    <button type="button" onclick="pickItem('popok')"  id="item-popok"  class="bigbtn item-btn choice p-2 pb-3"><img src="rehab-img/adduction-1.jpg" loading="lazy" alt="" class="w-full h-24 object-cover rounded-xl mb-1 pointer-events-none"><span class="text-3xl align-middle">🩲</span> <span class="text-lg" data-t="iPopok"></span></button>
                    <button type="button" onclick="pickItem('pantat')" id="item-pantat" class="bigbtn item-btn choice p-2 pb-3"><img src="rehab-img/bridge-1.jpg"    loading="lazy" alt="" class="w-full h-24 object-cover rounded-xl mb-1 pointer-events-none"><span class="text-3xl align-middle">🍑</span> <span class="text-lg" data-t="iPantat"></span></button>
                    <button type="button" onclick="pickItem('diri')"   id="item-diri"   class="bigbtn item-btn choice p-2 pb-3"><img src="rehab-img/stand-2.jpg"     loading="lazy" alt="" class="w-full h-24 object-cover rounded-xl mb-1 pointer-events-none"><span class="text-3xl align-middle">🧍</span> <span class="text-lg" data-t="iDiri"></span></button>
                </div>
                <!-- 四項復健都要能填數值（次數） -->
                <div id="ex-extra" class="hidden space-y-2">
                    <p class="text-2xl font-black">🔢 <span data-t="howMany"></span></p>
                    <div class="grid grid-cols-4 gap-2">
                        <button type="button" onclick="setExAmount(5)"  class="ex-chip chip bigbtn rounded-2xl border-4 border-gray-800 font-black text-2xl py-2">5</button>
                        <button type="button" onclick="setExAmount(10)"  class="ex-chip chip bigbtn rounded-2xl border-4 border-gray-800 font-black text-2xl py-2">10</button>
                        <button type="button" onclick="setExAmount(15)" class="ex-chip chip bigbtn rounded-2xl border-4 border-gray-800 font-black text-2xl py-2">15</button>
                        <button type="button" onclick="setExAmount(20)" class="ex-chip chip bigbtn rounded-2xl border-4 border-gray-800 font-black text-2xl py-2">20</button>
                    </div>
                    <div class="flex items-center gap-2">
                        <input id="ex-amount" type="number" min="1" class="flex-1 w-full border-4 border-gray-800 rounded-2xl py-3 px-3 text-4xl font-black text-center" placeholder="0">
                        <span class="text-3xl font-black" data-t="times"></span>
                    </div>
                </div>
            </div>

            <!-- d. 血壓 -->
            <div id="panel-tensi" class="space-y-2 hidden">
                <p class="text-2xl font-black">⬆️ <span data-t="bpSys"></span></p>

let LANG = (function(){ const s = localStorage.getItem('anak_lang'); return (s === 'id' || s === 'zh') ? s : 'zh'; })();
function t(key){ return (T[key] && T[key][LANG]) || ''; }

let S = { step1:false, type:null, item:null, color:null, status:null, gliserin:null, food:null, appetite:null, umed:null, lax:null, typeConfirmed:false };
let records = [], goals = {};
let UI = careUI({});   // 管理設定（顯示/彈窗/數字/記錄模式）；loadDay 後以雲端值刷新

function $(id){ return document.getElementById(id); }
function toast(msg, err){
    const el = $('toast'); el.innerText = msg;
    el.style.background = err ? '#b91c1c' : '#111827';
    el.classList.remove('opacity-0'); el.classList.add('show');
    setTimeout(() => { el.classList.add('opacity-0'); el.classList.remove('show'); }, 3000);
}

/* ===== 12 小時制顯示：00–12 ☀️ 白天、13–00 🌙 夜晚（內部與 sheet 仍存 24 小時制） ===== */
function hourIcon(h){ return (h >= 6 && h < 18) ? '☀️' : '🌙'; }  /* 06:00–18:00 太陽／18:00–06:00 月亮 */
function hour12(h){ return (h % 12 === 0) ? 12 : (h % 12); }
function hourLabel(h){ return `${hourIcon(h)} ${hour12(h)}`; }
function fmt12(hhmm){
    const h = parseInt(hhmm.slice(0,2), 10), m = hhmm.slice(3,5);
    return `${hourIcon(h)} ${hour12(h)}:${m}`;
}
function updateDayNight(){ $('daynight').innerText = hourIcon(parseInt($('sel-hour').value, 10)); }

/* ===== 語言切換 ===== */
function applyLang(){
    document.querySelectorAll('[data-t]').forEach(el => { el.innerHTML = t(el.dataset.t); });
    $('food-other').placeholder = t('otherFood').replace('✏️ ', '');
    renderFoodGrid();
    renderLangSwitch();
    renderAll();
}
function setLang(m){ LANG = m; localStorage.setItem('anak_lang', m); applyLang(); }
function renderLangSwitch(){
    $('lang-switch').innerHTML = [['zh','中文'],['id','ID']].map(([m,lbl]) =>
        `<button type="button" onclick="setLang('${m}')" class="px-3 py-1.5 rounded-full text-sm font-black border-2 ${LANG===m ? 'text-white border-transparent' : 'bg-white text-gray-500 border-gray-300'}" ${LANG===m ? 'style="background:var(--accent)"' : ''}>${lbl}</button>`).join('');
}

/* ===== 一、日期時間 ===== */
function initClock(){
    $('sel-hour').innerHTML = Array.from({length:24}, (_,h) => `<option value="${String(h).padStart(2,'0')}">${hourLabel(h)}</option>`).join('');
    $('sel-min').innerHTML = Array.from({length:60}, (_,i) => { const s = String(i).padStart(2,'0'); return `<option value="${s}">${s}</option>`; }).join('');
    $('input-date').value = careTodayStr();
    setNowTime();
    $('input-date').addEventListener('change', () => { showDate(); loadDay(); });
    $('sel-hour').addEventListener('change', updateDayNight);
    showDate();
}
function setNowTime(){
    const now = new Date();
    $('sel-hour').value = String(now.getHours()).padStart(2,'0');
    $('sel-min').value = String(now.getMinutes()).padStart(2,'0');
    updateDayNight();
}
function showDate(){ $('date-display').innerText = ($('input-date').value || '').replace(/-/g,'/'); }
function curTime(){ return $('sel-hour').value + ':' + $('sel-min').value; }
function okStep1(){ S.step1 = true; refresh(); focusStep('step2'); }

/* ===== 二、選類別 ===== */
function pickType(tp){
    S.type = tp; S.item = null; S.color = null; S.status = null; S.gliserin = null; S.food = null;
    S.appetite = null; S.umed = null; S.lax = null; S.typeConfirmed = false;
    $('input-amount').value = ''; $('pipis-amount').value = ''; $('food-other').value = ''; $('ex-amount').value = '';
    ['bp-sys','bp-dia','bp-hr'].forEach(id => $(id).value = '');
    document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('selected'));
    $('type-' + tp).classList.add('selected');
    paintAnakMed();
    refresh(); focusStep('step2');
}
function confirmStep2(){ S.typeConfirmed = true; refresh(); focusStep('step2b'); }
/* ===== 三、選細項 ===== */
function pickItem(k){
    S.item = k; S.food = null;
    document.querySelectorAll('.item-btn').forEach(b => b.classList.remove('selected'));
    $('item-' + k).classList.add('selected');
    if (k !== 'food') $('food-other').value = '';
    // 藥物預設沿用「前一次」設定（管理者鎖定唯讀，見 careDailyMed／careSaveDailyMed）
    if (k === 'pipis' && S.umed === null) { S.umed = careDailyMed(goals).diuretic; paintAnakMed(); }
    if (k === 'pup'   && S.lax  === null) { S.lax  = careDailyMed(goals).laxPills;  paintAnakMed(); }
    refresh();
}
/* ===== 當日藥物（鎖定，管理者 PIN 解鎖才能改）與胃口（必選） ===== */
function careMedLocked(){ return sessionStorage.getItem('care_admin_ok') !== '1'; }
function tryUnlockMed(){
    if (!careMedLocked()) return;
    if (careAskPin()) { sessionStorage.setItem('care_admin_ok', '1'); paintAnakMed(); }
}
function saveMedToCloud(patch){
    const json = careSaveDailyMed(goals, patch);
    fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({ action:'setMed', val: json }) })
        .catch(() => toast(t('failed'), true));
}
function pickUmed(v){
    if (careMedLocked()) { tryUnlockMed(); return; }
    S.umed = v; paintAnakMed(); refresh();
    saveMedToCloud({ diuretic: v });
}
function pickLax(n){
    if (careMedLocked()) { tryUnlockMed(); return; }
    S.lax = n; paintAnakMed(); refresh();
    saveMedToCloud({ laxPills: n });
}
function pickAppetite(v){ S.appetite = v; paintAnakMed(); refresh(); }
function paintAnakMed(){
    document.querySelectorAll('.umed-btn').forEach(b => b.classList.toggle('selected', S.umed !== null && (b.dataset.med || '') === S.umed));
    document.querySelectorAll('.lax-btn').forEach(b => b.classList.toggle('selected', S.lax !== null && parseInt(b.dataset.lax, 10) === S.lax));
    document.querySelectorAll('.app-btn').forEach(b => b.classList.toggle('selected', !!S.appetite && b.dataset.app === S.appetite));
    const locked = careMedLocked();
    [$('umed-grid'), $('lax-grid')].forEach(g => {
        g.classList.toggle('opacity-60', locked);
        g.querySelectorAll('button').forEach(b => b.style.pointerEvents = locked ? 'none' : '');
    });
    $('umed-lock').classList.toggle('hidden', !locked);
    $('lax-lock').classList.toggle('hidden', !locked);
}
function setAmount(v){ $('input-amount').value = v; refresh(); }
function setExAmount(v){
    $('ex-amount').value = v;
    document.querySelectorAll('.ex-chip').forEach(b => b.classList.toggle('selected', parseInt(b.innerText,10) === v));
    refresh();
}
function renderFoodGrid(){

            <span class="block text-4xl leading-none mb-1">${f.emoji}</span>${LANG==='zh' ? f.zh : f.rom}${f.cc ? `<span class="block text-sm font-bold text-amber-700">${f.cc} cc</span>` : ''}
        </button>`).join('');

    if (S.food && S.food !== 'LAINNYA') {
        const btn = document.querySelector(`.food-btn[data-food="${S.food}"]`);
        if (btn) btn.classList.add('ringed');
    }
}
function pickFood(key, btn){
    S.food = key;
    $('food-other').value = '';
    document.querySelectorAll('.food-btn').forEach(b => b.classList.remove('ringed'));
    if (btn) btn.classList.add('ringed');
    const f = FOODS.find(x => x.key === key);
    $('input-amount').value = (f && f.cc) ? f.cc : '';
    refresh();
}
function onFoodOther(){
    if ($('food-other').value.trim()) {
        S.food = 'LAINNYA';
        document.querySelectorAll('.food-btn').forEach(b => b.classList.remove('ringed'));
    } else if (S.food === 'LAINNYA') { S.food = null; }

}

function pickGliserin(btn, v){ S.gliserin = v; document.querySelectorAll('.glis-btn').forEach(b=>b.classList.remove('ringed')); btn.classList.add('ringed'); refresh(); }

/* ===== 組 payload（category 名稱與 sheet 相同） ===== */
function buildPayload(){
    const date = $('input-date').value, time = curTime();
    const rid = 'REC_' + Date.now() + '_' + Math.floor(Math.random()*1000);
    if (S.type === 'tensi') {
        const sys = $('bp-sys').value, dia = $('bp-dia').value, hr = $('bp-hr').value;
        if (!sys || !dia || !hr) return null;
        const category = (time >= '05:00' && time <= '15:00') ? '血壓/心跳(早)' : '血壓/心跳(晚)';
        return { action:'insert', type:'血壓', category, date, time, amount:`${sys}/${dia} (心跳:${hr})`, note:'👤U' + CARE_USER, recordId: rid, _bp:{sys,dia,hr} };
    }
    if (!S.item) return null;
    const m = ITEM_MAP[S.item];
    let amount, note = '';
    if (S.type === 'makan') {
        amount = parseInt($('input-amount').value, 10);
        if (!amount || amount < 1) return null;
        if (S.item === 'food') {
            if (!S.food) return null;
            if (S.food === 'LAINNYA') { note = $('food-other').value.trim(); if (!note) return null; }
            else { const f = FOODS.find(x => x.key === S.food); note = f ? `${f.zh} / ${f.rom}` : ''; if (!note) return null; }
            if (!S.appetite) return null;   // 胃口必選
            note += ` [胃口: ${S.appetite}]`;
        }
    } else if (S.item === 'pipis') {
        if (UI.urineMode === 'count') {
            if (!S.color) return null;   // 次數制：免填 cc，自動 1 筆，仍需顏色
            amount = 1;
        } else {
            amount = parseInt($('pipis-amount').value, 10);
            if (!amount || amount < 1 || !S.color) return null;
        }
        note = S.color + (S.umed ? (S.umed === 'full' ? ' [當日附加: 利尿藥物]' : ' [當日附加: 利尿藥物(輔助)]') : '');
    } else if (S.item === 'pup') {
        if (!S.status || S.gliserin === null) return null;
        amount = 1;
        note = S.status + (S.gliserin ? ' [浣腸 / Supositoria gliserin]' : '') + (S.lax > 0 ? ` [當日附加: 利便藥物${S.lax}顆]` : '');
    } else {
        // 運動：四項復健都要填實際完成次數
        amount = parseInt($('ex-amount').value, 10);
        if (!amount || amount < 1) return null;
    }
    note = (note ? note + ' ' : '') + '👤U' + CARE_USER;
    return { action:'insert', type:m.type, category:m.category, date, time, amount, note, recordId: rid };
}

/* ===== 漸進揭露（一→二→三→存檔→四） ===== */
function refresh(){
    toggleSection('step2', S.step1);
    toggleSection('step2-ok', !!S.type);
    toggleSection('step2b', S.step1 && S.typeConfirmed);
    ['makan','keluar','latihan','tensi'].forEach(tp => $('panel-' + tp).classList.toggle('hidden', S.type !== tp));
    if (S.type === 'makan') {
        $('quick-susu').classList.toggle('hidden', S.item !== 'susu');
        $('quick-food').classList.toggle('hidden', S.item !== 'food');
        $('amount-row').classList.toggle('hidden', !S.item);
    }
    if (S.type === 'keluar') {
        $('pipis-extra').classList.toggle('hidden', S.item !== 'pipis');
        $('pup-extra').classList.toggle('hidden', S.item !== 'pup');
        const par = $('pipis-amount-row'); if (par) par.classList.toggle('hidden', UI.urineMode === 'count');   // 次數制免填 cc
    }
    if (S.type === 'latihan') {
        $('ex-extra').classList.toggle('hidden', !S.item);
    }
    const ok = !!buildPayload();
    const step3WasHidden = $('step3').classList.contains('hidden');
    toggleSection('step3', S.step1 && S.typeConfirmed && ok);
    $('need-hint').classList.toggle('hidden', !(S.step1 && S.typeConfirmed) || ok);
    if (ok && step3WasHidden) focusStep('step3');   // 只在剛出現時捲動，打字中不亂跳
    $('step4').classList.toggle('hidden', records.length === 0);
    updateGuide();
}
/* ===== 藍色閃動引導：依填寫順序逐步，「這一刻要閃哪些元素」可以是多個
 * （紫色大框標「目前步驟」、藍框標「現在要填/要按」）。
 * 規則：一路走過各欄位；已完成的「選項群組」把選中的那顆留在閃爍清單裡累積續閃、
 * 同組其他選項回黑；第一個還沒完成的欄位（整組全閃，或單一輸入框閃）閃完就停止往下走；
 * 全部完成 → 只剩 #btn-save 閃（利尿/利便藥物欄位跳過，不列入順序）。 ===== */
function updateGuide(){
    document.querySelectorAll('.guide-flash').forEach(el => el.classList.remove('guide-flash'));
    const flashEls = els => els.forEach(el => { if (el && !el.closest('.hidden')) el.classList.add('guide-flash'); });

    if (!S.step1) { flashEls([$('date-display'), $('sel-hour'), $('sel-min')]); return; }

    if (!S.typeConfirmed) {
        if (!S.type) flashEls(Array.from(document.querySelectorAll('.type-btn')));
        else flashEls([$('type-' + S.type), $('step2-ok')]);
        return;
    }

    const grp = (all, selected, okFn) => {
        const sel = document.querySelector(selected);
        return { kind:'g', all: Array.from(document.querySelectorAll(all)), sel, ok: okFn ? okFn() : !!sel };
    };
    const inp = id => ({ kind:'i', el: $(id), ok: !!$(id).value });

    let steps = [];
    if (S.type === 'tensi') {
        steps = [inp('bp-sys'), inp('bp-dia'), inp('bp-hr')];
    } else if (S.type === 'makan') {
        steps.push(grp('#item-grid-makan .item-btn', '#item-grid-makan .item-btn.selected'));
        // food-grid：自填食物（LAINNYA）沒有按鈕可續閃，但仍算完成，靠 okFn 用 S.food 判斷
        if (S.item === 'food') steps.push(grp('.food-btn', '.food-btn.ringed', () => !!S.food));
        // 兒童改3：引導順序 類別 ＞ 胃口 ＞ CC 數 ＞ 儲存（胃口排在容量之前）
        if (S.item === 'food') steps.push(grp('.app-btn', '.app-btn.selected'));
        steps.push(inp('input-amount'));
    } else if (S.type === 'keluar') {
        steps.push(grp('#item-grid-keluar .item-btn', '#item-grid-keluar .item-btn.selected'));
        if (S.item === 'pipis') {
            if (UI.urineMode !== 'count') steps.push(inp('pipis-amount'));
            steps.push(grp('.color-btn', '.color-btn.ringed'));
        } else if (S.item === 'pup') {
            steps.push(grp('.status-btn', '.status-btn.ringed'));
            steps.push(grp('.glis-btn', '.glis-btn.ringed'));
        }
    } else if (S.type === 'latihan') {
        steps.push(grp('#item-grid-latihan .item-btn', '#item-grid-latihan .item-btn.selected'));
        steps.push(inp('ex-amount'));
    }

    const acc = [];
    for (const step of steps) {
        if (step.kind === 'g') {
            if (step.ok) { if (step.sel) acc.push(step.sel); continue; }
            flashEls(acc.concat(step.all));
            return;
        } else {
            if (step.ok) continue;
            flashEls(acc.concat([step.el]));
            return;
        }
    }
    flashEls([$('btn-save')]);
}
function toggleSection(id, show){
    const el = $(id);
    const wasHidden = el.classList.contains('hidden');
    el.classList.toggle('hidden', !show);
    if (show && wasHidden) { el.classList.remove('enter'); void el.offsetWidth; el.classList.add('enter'); }
}
function focusStep(id){
    document.querySelectorAll('.step').forEach(s => s.classList.remove('now'));
    const el = $(id);
    if (el && !el.classList.contains('hidden')) { el.classList.add('now'); el.scrollIntoView({ behavior:'smooth', block:'center' }); }
}

/* ===== 存檔 ===== */
function save(){
    const p = buildPayload();
    if (!p) { $('need-hint').classList.remove('hidden'); return; }
    if (p._bp) {   // 血壓合理區間：超標→大紅彈窗（不擋存檔）
        const chk = careBpViolations(p.category, p._bp.sys, p._bp.dia, p._bp.hr, UI);
        if (chk.violations.length && UI.popup.bpAlert) {
            $('bp-modal-body').innerHTML = chk.violations.map(v =>
                `<div class="bg-red-100 border-4 border-red-500 rounded-2xl p-3">
                    <p class="text-2xl font-black text-red-700">${LANG==='zh' ? v.zh : v.id}: ${v.val}</p>
                    <p class="text-xl font-black">${t('normalRange')}: ${v.lo}–${v.hi}</p>
                </div>`).join('');
            $('bp-modal').classList.remove('hidden');
        }
        delete p._bp;
    }
    $('btn-save').disabled = true; $('btn-save').innerText = '⏳ …';
    records.unshift({ recordId:p.recordId, type:p.type, category:p.category, date:p.date, time:p.time, amount:String(p.amount), note:p.note });
    renderAll();
    fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(p) })
        .then(r => r.json())
        .then(() => { toast(t('saved')); resetToStart(); setTimeout(loadDay, 1500); })
        .catch(() => { records = records.filter(r => r.recordId !== p.recordId); renderAll(); toast(t('failed'), true); })
        .finally(() => { $('btn-save').disabled = false; $('btn-save').innerHTML = t('save'); });
}
/* 儲存後：頁面回復成只出現「步驟 1 ＋ 步驟 4（今日紀錄）」，時間重設為現在 */
function resetToStart(){
    S = { step1:false, type:null, item:null, color:null, status:null, gliserin:null, food:null, appetite:null, umed:null, lax:null, typeConfirmed:false };
    $('input-amount').value = ''; $('pipis-amount').value = ''; $('food-other').value = ''; $('ex-amount').value = '';
    ['bp-sys','bp-dia','bp-hr'].forEach(id => $(id).value = '');
    document.querySelectorAll('.type-btn,.item-btn').forEach(b => b.classList.remove('selected'));
    document.querySelectorAll('.food-btn,.color-btn,.status-btn,.glis-btn').forEach(b => b.classList.remove('ringed'));
    document.querySelectorAll('.ex-chip').forEach(b => b.classList.remove('selected'));
    paintAnakMed();
    setNowTime();
    refresh(); focusStep('step1');
}

/* ===== 四、今日全部紀錄＋刪除（外框灰色鈕，紅色留給緊急） ===== */
let delId = null;
function askDelete(id){ delId = id; $('del-modal').classList.remove('hidden'); }
function closeDel(){ delId = null; $('del-modal').classList.add('hidden'); }
function doDelete(){
    const id = delId; closeDel(); if (!id) return;
    records = records.filter(r => r.recordId !== id);
    renderAll();
    fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({ action:'markError', recordId:id }) })
        .then(r => r.json()).then(() => { toast(t('deleted')); setTimeout(loadDay, 1200); })
        .catch(() => { toast(t('failed'), true); loadDay(); });
}
function renderAll(){
    // 目標列：每個項目各自顯示 🎯今日目標｜✅目前已達（U1–U5 總和）。純圖示，不用文字
    // 💧＝雲端目標；🚽/💩＝演算法（care-tasks.js）；四項復健＝各自雲端目標
    const sumCat = cats => records.filter(r => cats.includes(r.category)).reduce((s,r) => s + (parseFloat(r.amount) || 0), 0);
    const intake = sumCat(['飲水量','服藥飲水','營養飲品','進食']);
    const urine = sumCat(['尿液']);
    const stoolN = records.filter(r => r.category === '排便').length;
    const med = careMedFromRecords(records);
    const uGoal = careUrineGoal(intake, med.diuretic, UI);
    const sGoal = careStoolGoal(med.laxPills);
    const wGoal = parseFloat(goals['goal_總攝入水量']) || 0;
    // 兩行式：第一行 emoji＋🎯目標＋✅已達（可換行、數字絕不被進度條擠掉），第二行進度條吃滿寬
    const strip = (emoji, goal, done, unit, over) => {
        const pct = goal > 0 ? Math.min(100, Math.round(done / goal * 100)) : 0;
        const col = over ? 'var(--danger)' : 'var(--accent)';
        return `<div>
            <div class="flex items-center gap-1.5 flex-wrap">
                <span class="text-2xl w-9 text-center shrink-0">${emoji}</span>
                <span class="text-base font-black text-gray-700 whitespace-nowrap">🎯${goal > 0 ? goal : '…'}${unit}</span>
                <span class="text-base font-black whitespace-nowrap" style="color:${col}">✅${done}${unit}</span>
            </div>
            <div class="h-3 rounded-full bg-gray-200 overflow-hidden mt-0.5"><div class="h-full rounded-full transition-all duration-700" style="width:${pct}%;background:${col}"></div></div>
        </div>`;
    };
    const uCount = UI.urineMode === 'count';
    let strips = strip('💧', wGoal, intake, 'cc', UI.popup.fluidOver && intake > UI.num.fluidMax)
               + strip('🚽', uCount ? 0 : uGoal, uCount ? records.filter(r=>r.category==='尿液').length : urine, uCount ? t('times') : 'cc', !uCount && urine > 0 && uGoal > 0 && urine > uGoal)
               + strip('💩', sGoal, stoolN, t('times'), false);
    strips += `<div class="grid grid-cols-4 gap-1 pt-0.5">` + CARE_EX_TYPES.map(ex => {
        const gEx = parseFloat(goals['goal_' + ex]) || 0;
        const done = sumCat([ex]);
        const hit = gEx > 0 && done >= gEx;
        return `<div class="rounded-xl border-[3px] ${hit ? 'border-green-600 bg-green-50' : 'border-gray-300 bg-white'} text-center py-0.5">
            <span class="block text-xl leading-none">${CAT_EMOJI[ex]}</span>
            <span class="block text-[13px] font-black leading-none">✅${done}</span>
            <span class="block text-[13px] font-black text-gray-500 leading-none">🎯${gEx > 0 ? gEx : '…'}</span>
        </div>`;
    }).join('') + `</div>`;
    $('goal-strips').innerHTML = strips;
    // 紀錄列：依時段分框（同管理者總表），時間一律 12 小時制＋☀️/🌙
    const SLOT_EMOJI = { dawn:'🌙', morning:'🌅', midday:'☀️', evening:'🌇', night:'🛏️', late:'💤' };
    const recRow = r => {
        const isBP = (r.category || '').includes('血壓');
        const emoji = isBP ? '❤️' : (CAT_EMOJI[r.category] || '📝');
        const unit = isBP ? '' : (['排便','仰臥抬腿','大腿內收','橋式抬臀','站立'].includes(r.category) ? t('times') : ' cc');
        const note = careNoteDisplay(r.note || '', LANG);
        return `<div class="flex items-center gap-2 border-[3px] border-gray-400 rounded-2xl p-3 bg-white">
            <div class="flex-1 min-w-0">
                <p class="text-2xl font-black">${fmt12(r.time)} ${emoji} ${r.amount}${unit}</p>
                ${note ? `<p class="text-base font-bold text-gray-600 truncate">${note}</p>` : ''}
            </div>
            <button type="button" onclick="askDelete('${r.recordId}')" class="shrink-0 w-16 h-16 rounded-2xl bg-white border-[3px] border-gray-400 text-gray-500 text-4xl font-black bigbtn leading-none">✕</button>
        </div>`;
    };
    const list = $('rec-list');
    if (records.length === 0) { list.innerHTML = `<p class="text-xl font-black text-gray-500 text-center py-4">${t('noRec')}</p>`; }
    else {
        list.innerHTML = [...CARE_SLOTS].reverse().map(s => {   /* 今日紀錄降冪：最新時段在最上 */
            const recs = records.filter(r => careInSlot(r.time, s)).sort((a,b) => b.time.localeCompare(a.time));
            if (recs.length === 0) return '';
            return `<div class="border-4 border-gray-700 rounded-3xl p-2 space-y-2 bg-stone-50">
                <p class="text-2xl font-black text-gray-800 px-1">${SLOT_EMOJI[s.key] || ''} ${LANG==='zh' ? s.zh : s.id} <span class="text-base text-gray-500">${fmt12(s.start)}–${fmt12(s.end)}</span></p>
                ${recs.map(recRow).join('')}
            </div>`;
        }).join('');
    }
    checkWarnings();
    refresh();
}

/* ===== 兒童版警示（跟大人版同規則，用小朋友看得懂的話）：
 * 喝太多(>1500cc)、尿太多(>今日尿液目標=喝的×0.9；利尿藥物(輔助)×1.1；利尿藥物×1.3)
 * → 動態大紅橫幅＋每天每種跳一次大彈窗 ===== */
/* ===== 管理設定套用：床圍欄警語 顯示/自訂文字（兒童頁固定雙語，無語言 CSS 閘門） ===== */
function applyAnakUiStatic(){
    const br = $('anak-bedrail');
    if (br) br.classList.toggle('hidden', !UI.show.bedRail);
    const tz = ((UI.text.bedRail||{}).zh||'').trim(), ti = ((UI.text.bedRail||{}).id||'').trim();
    const z = $('anak-bedrail-zh'), i = $('anak-bedrail-id');
    if (z && tz) z.textContent = tz;
    if (i && ti) i.textContent = ti;
}
function checkWarnings(){
    const intake = records.filter(r => ['飲水量','服藥飲水','營養飲品','進食'].includes(r.category)).reduce((s,r) => s + (parseFloat(r.amount) || 0), 0);
    const urine = records.filter(r => r.category === '尿液').reduce((s,r) => s + (parseFloat(r.amount) || 0), 0);
    const uMax = careUrineGoal(intake, careMedFromRecords(records).diuretic, UI);
    const warns = [];
    if (UI.popup.fluidOver && intake > UI.num.fluidMax) warns.push({ key:'minum', text:t('warnDrink') });
    if (UI.urineMode !== 'count' && UI.popup.urineOver && urine > 0 && uMax > 0 && urine > uMax) warns.push({ key:'pipis', text:t('warnPipis') });
    $('warn-box').innerHTML = warns.map(w =>
        `<div class="alert-banner border-8 bg-red-100 rounded-3xl p-3 text-2xl font-black" style="border-color: var(--danger); color: var(--danger)"><span class="bounce-big">🚨</span> ${w.text}<br><span class="text-xl">${t('callAdult')}</span></div>`).join('');
    const date = $('input-date').value || careTodayStr();
    const fresh = warns.filter(w => !localStorage.getItem('anak_warn_' + date + '_' + w.key));
    if (fresh.length) {
        $('warn-modal-body').innerHTML = fresh.map(w => `<p class="text-3xl font-black" style="color: var(--danger)">${w.text}</p>`).join('');
        $('warn-modal').classList.remove('hidden');
        fresh.forEach(w => localStorage.setItem('anak_warn_' + date + '_' + w.key, '1'));
    }
}

/* ===== 同步：快取先渲染，背景刷新（不擋操作） ===== */
function fetchWithTimeout(url, ms){
    const ctrl = new AbortController();
    const tm = setTimeout(() => ctrl.abort(), ms);
    return fetch(url, { cache:'no-store', signal: ctrl.signal }).finally(() => clearTimeout(tm));
}
function loadDay(){
    const date = $('input-date').value || careTodayStr();
    const key = 'anak_cache_' + date;
    try { const c = JSON.parse(localStorage.getItem(key) || 'null'); if (c) { records = c.records; goals = c.goals; UI = careUI(goals); applyAnakUiStatic(); renderAll(); } } catch(e) {}
    $('sync-icon').classList.add('animate-spin-slow');
    const url = `${GAS_URL}?date=${date}&t=${Date.now()}`;
    fetchWithTimeout(url, 20000)
        .catch(() => fetchWithTimeout(url, 20000))
        .then(r => r.json())
        .then(data => {
            records = (data.records || []).filter(r => r.status !== '無效');
            goals = data.goals || {};
            UI = careUI(goals); applyAnakUiStatic();
            try { localStorage.setItem(key, JSON.stringify({ records, goals, ts:Date.now() })); } catch(e) {}
            renderAll();
        })
        .catch(() => toast(t('syncFail'), true))
        .finally(() => $('sync-icon').classList.remove('animate-spin-slow'));
}

window.onload = function(){
    initClock();
    applyLang();
    applyAnakUiStatic();   // 先用預設設定套用；loadDay 回來再以雲端值刷新
    // 手動輸入的欄位（cc/次數/血壓三格/自填食物）也要即時重算，儲存鈕才會出現
    ['input-amount','pipis-amount','ex-amount','bp-sys','bp-dia','bp-hr'].forEach(id => $(id).addEventListener('input', refresh));
    $('food-other').addEventListener('input', onFoodOther);
    refresh();
    focusStep('step1');
    loadDay();
};
</script>
