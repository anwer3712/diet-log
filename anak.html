<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>奶奶日誌 — 兒童版 / Catatan Nenek — Anak</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="care-tasks.js?v=7"></script>
    <style>
        /* ============================================================
         * 兒童＋先天遠視設計原則：超大字、白底高對比、粗實心框、
         * 引導一律用「粗框＋強光暈」動態（禁用淡色/細閃動，他看不到）
         * 主色改為深青 teal（原 sky 藍停用）；紅色只留給緊急警示
         * ============================================================ */
        :root {
            --ink: #111827;
            --line: #d1d5db;
            --accent: #0f766e;        /* 深青：選取/主要動作 */
            --accent-soft: #ccfbf1;
            --guide: #6d28d9;         /* 深紫：目前步驟引導（與大人版一致） */
            --guide2: #a855f7;
            --danger: #b91c1c;        /* 深紅：緊急專用 */
        }
        body { background: #ffffff; color: var(--ink); font-size: 22px; }

        /* 步驟卡：粗框＋左上超大數字徽章 */
        .step { position: relative; border: 4px solid var(--line); border-radius: 1.75rem; }
        .stepnum {
            position: absolute; top: -1.35rem; left: -0.4rem;
            width: 3.6rem; height: 3.6rem; border-radius: 9999px;
            background: #111827; color: #fff;
            font-size: 2.1rem; font-weight: 900; line-height: 1;
            display: flex; align-items: center; justify-content: center;
            border: 4px solid #fff; box-shadow: 0 3px 10px rgba(0,0,0,.25);
            z-index: 10;
        }
        /* 目前步驟：深紫粗框動態引導（取代 DI SINI 文字） */
        .step.now { border-color: var(--guide); animation: guide-step 1.1s infinite ease-in-out; }
        .step.now .stepnum { background: var(--guide); animation: badge-pulse 1.1s infinite ease-in-out; }
        @keyframes guide-step {
            0%, 100% { border-color: var(--guide);  box-shadow: 0 0 0 2px rgba(109,40,217,.45); }
            50%      { border-color: var(--guide2); box-shadow: 0 0 0 8px rgba(109,40,217,.30); }
        }
        @keyframes badge-pulse {
            0%, 100% { transform: scale(1); }
            50%      { transform: scale(1.12); }
        }

        /* 出現動畫：步驟/彈窗滑入 */
        .enter { animation: pop-in .35s cubic-bezier(.2, .9, .3, 1.3); }
        @keyframes pop-in {
            from { opacity: 0; transform: translateY(14px) scale(.96); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* 緊急警示動態：深紅強光暈＋進場搖晃，務必醒目 */
        .alert-banner { animation: shake .5s ease 2, glow-red 1.2s infinite ease-in-out; }
        .glow-red { animation: glow-red 1.2s infinite ease-in-out; }
        @keyframes glow-red {
            0%, 100% { box-shadow: 0 0 0 0 rgba(153, 27, 27, .9); }
            50%      { box-shadow: 0 0 26px 10px rgba(153, 27, 27, .5); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-7px); } 40% { transform: translateX(7px); }
            60% { transform: translateX(-5px); } 80% { transform: translateX(5px); }
        }
        .bounce-big { display: inline-block; animation: bounce-big 1s infinite; }
        @keyframes bounce-big {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-12px); }
        }
        .modal-card { animation: pop-in .3s cubic-bezier(.2, .9, .3, 1.3); }
        .modal-card.danger { animation: pop-in .3s cubic-bezier(.2, .9, .3, 1.3), shake .5s ease .3s 2, glow-red 1.2s infinite ease-in-out .9s; }

        /* 按鈕通用 */
        .bigbtn { min-height: 64px; transition: transform .12s ease, background-color .2s, color .2s, border-color .2s; }
        .bigbtn:active { transform: scale(.95); }
        .choice { border: 4px solid #1f2937; border-radius: 1.25rem; font-weight: 900; background: #fff; }
        .choice.selected { background: var(--accent); border-color: var(--accent); color: #fff; }
        .chip.selected { background: var(--accent); border-color: var(--accent); color: #fff; }
        .ringed { box-shadow: 0 0 0 6px var(--accent); border-color: var(--accent) !important; }

        .animate-spin-slow { animation: spin 3s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        #toast { transition: opacity .3s, transform .3s; transform: translate(-50%, 20px); }
        #toast.show { opacity: 1; transform: translate(-50%, 0); }

        @media (prefers-reduced-motion: reduce) {
            * { animation: none !important; transition: none !important; }
        }
    </style>
</head>
<body class="min-h-screen pb-16 font-sans">
    <div class="max-w-md mx-auto px-3 pt-4 space-y-8">

        <!-- 頂部：標題本身就是回大人版的連結（不另設按鈕，畫面乾淨） -->
        <header class="space-y-2">
            <div class="flex items-center justify-between gap-2">
                <a href="index.html" class="flex-1 min-w-0 active:opacity-60">

                <button type="button" onclick="pickType('latihan')" id="type-latihan" class="bigbtn type-btn choice py-4"><span class="block text-5xl leading-none mb-1">💪</span><span class="text-xl" data-t="tLatihan"></span></button>

            </div>

        <!-- 三、細項 -->

            <h2 class="text-2xl font-black text-center">🤔 <span data-t="s3"></span></h2>

                    <button type="button" onclick="pickItem('susu')" id="item-susu" class="bigbtn item-btn choice py-3"><span class="block text-5xl leading-none mb-1">🥛</span><span class="text-lg" data-t="iSusu"></span></button>
                    <button type="button" onclick="pickItem('food')" id="item-food" class="bigbtn item-btn choice py-3"><span class="block text-5xl leading-none mb-1">🥣</span><span class="text-lg" data-t="iFood"></span></button>
                </div>

                    <button type="button" onclick="setAmount(240)" class="bigbtn rounded-2xl border-4 font-black text-xl py-3" style="border-color: var(--accent); background: var(--accent-soft)" data-t="fullCan"></button>

                        <span class="text-3xl font-black">cc</span>

            <!-- b. 排出來的（尿液改用 🚽，與飲水 💧 區隔） -->
            <div id="panel-keluar" class="space-y-3 hidden">
                <div class="grid grid-cols-2 gap-3">
                    <button type="button" onclick="pickItem('pipis')" id="item-pipis" class="bigbtn item-btn choice py-3"><span class="block text-5xl leading-none mb-1">🚽</span><span class="text-xl" data-t="iPipis"></span></button>
                    <button type="button" onclick="pickItem('pup')"   id="item-pup"   class="bigbtn item-btn choice py-3"><span class="block text-5xl leading-none mb-1">💩</span><span class="text-xl" data-t="iPup"></span></button>
                </div>
                <div id="pipis-extra" class="hidden space-y-2">
                    <p class="text-2xl font-black" data-t="howMuch"></p>
                    <div class="flex items-center gap-2">
                        <input id="pipis-amount" type="number" min="1" class="flex-1 w-full border-4 border-gray-800 rounded-2xl py-3 px-3 text-4xl font-black text-center" placeholder="0">

                    </div>

                    <div class="grid grid-cols-3 gap-2">

                        <button type="button" onclick="pickColor(this,'深黃色 / Kuning Tua')"   class="color-btn bigbtn rounded-2xl border-4 border-gray-800 font-black text-lg py-3" style="background:#f59e0b" data-t="cDark"></button>
                        <button type="button" onclick="pickColor(this,'正常淺黃 / Kuning Muda')" class="color-btn bigbtn rounded-2xl border-4 border-gray-800 font-black text-lg py-3" style="background:#fde68a" data-t="cLight"></button>
                    </div>
                </div>
                <div id="pup-extra" class="hidden space-y-2">
                    <p class="text-2xl font-black" data-t="pupHow"></p>
                    <div class="grid grid-cols-3 gap-2">
                        <button type="button" onclick="pickStatus(this,'稀便 / feses encer')"        class="status-btn bigbtn rounded-2xl border-4 border-gray-800 bg-orange-100 font-black text-xl py-3" data-t="pEncer"></button>
                        <button type="button" onclick="pickStatus(this,'大便乾硬 / Kering dan keras')" class="status-btn bigbtn rounded-2xl border-4 border-gray-800 bg-amber-100 font-black text-xl py-3" data-t="pKeras"></button>

                    <button type="button" onclick="pickItem('diri')"   id="item-diri"   class="bigbtn item-btn choice p-2 pb-3"><img src="rehab-img/stand-2.jpg"     loading="lazy" alt="" class="w-full h-24 object-cover rounded-xl mb-1 pointer-events-none"><span class="text-3xl align-middle">🧍</span> <span class="text-lg" data-t="iDiri"></span></button>
                </div>
                <!-- 四項復健都要能填數值（次數） -->

                    <div class="grid grid-cols-4 gap-2">

        <section id="step3" class="step bg-white p-4 hidden">

    <!-- 刪除確認：中性色（紅色保留給緊急狀況） -->

            <div class="grid grid-cols-2 gap-3">

    <!-- 一般警示（喝太多/尿太多）：大彈窗＋動態 -->

        <div class="modal-card danger bg-white rounded-3xl border-8 p-5 w-full max-w-sm text-center space-y-3" style="border-color: var(--danger)">
            <p class="text-6xl bounce-big">🚨</p>
            <div id="warn-modal-body" class="space-y-2"></div>
            <p class="text-2xl font-black" data-t="callAdult"></p>
            <button type="button" onclick="document.getElementById('warn-modal').classList.add('hidden')" class="bigbtn w-full text-white rounded-2xl text-2xl font-black py-3" style="background: var(--danger)" data-t="okCalled"></button>
        </div>
    </div>

    <div id="toast" class="fixed bottom-6 left-1/2 bg-gray-900 text-white text-2xl font-black py-4 px-8 rounded-full opacity-0 z-50 pointer-events-none">…</div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycby-3Q--z4t03yOtgtMpkbhYccmxD9dqvmrqQdX4sg4vZNBfjgyuKYuL6HZuHkro7p0o/exec";
const CARE_USER = '5';   // 本頁固定身分：👤U5（存進同一張 sheet，管理者總表自動併入總和）

/* 項目 → sheet 同名 category 私下轉換表（跟 index.html 完全一致，分頁讀取才不會錯） */
const ITEM_MAP = {
    air:   { type:'攝入', category:'飲水量' },
    obat:  { type:'攝入', category:'服藥飲水' },
    susu:  { type:'攝入', category:'營養飲品' },
    food:  { type:'攝入', category:'進食' },
    pipis: { type:'排出', category:'尿液' },

/* ===== 12 小時制顯示：00–12 ☀️ 白天、13–00 🌙 夜晚（內部與 sheet 仍存 24 小時制） ===== */
function hourIcon(h){ return (h >= 1 && h <= 12) ? '☀️' : '🌙'; }
function hour12(h){ return (h % 12 === 0) ? 12 : (h % 12); }
function hourLabel(h){ return `${hourIcon(h)} ${hour12(h)}`; }
function fmt12(hhmm){
    const h = parseInt(hhmm.slice(0,2), 10), m = hhmm.slice(3,5);
    return `${hourIcon(h)} ${hour12(h)}:${m}`;
}
function updateDayNight(){ $('daynight').innerText = hourIcon(parseInt($('sel-hour').value, 10)); }

}

/* ===== 組 payload（category 名稱與 sheet 相同） ===== */
function buildPayload(){
    const date = $('input-date').value, time = curTime();
    const rid = 'REC_' + Date.now() + '_' + Math.floor(Math.random()*1000);
    if (S.type === 'tensi') {
        const sys = $('bp-sys').value, dia = $('bp-dia').value, hr = $('bp-hr').value;
        if (!sys || !dia || !hr) return null;
        const category = (time >= '05:00' && time <= '15:00') ? '血壓/心跳(早)' : '血壓/心跳(晚)';
        return { action:'insert', type:'血壓', category, date, time, amount:`${sys}/${dia} (心跳:${hr})`, note:'👤U' + CARE_USER, recordId: rid, _bp:{sys,dia,hr} };
    }
    if (!S.item) return null;
    const m = ITEM_MAP[S.item];
    let amount, note = '';
    if (S.type === 'makan') {
        amount = parseInt($('input-amount').value, 10);
        if (!amount || amount < 1) return null;
        if (S.item === 'food') {
            if (!S.food) return null;
            if (S.food === 'LAINNYA') { note = $('food-other').value.trim(); if (!note) return null; }
            else { const f = FOODS.find(x => x.key === S.food); note = f ? `${f.zh} / ${f.rom}` : ''; if (!note) return null; }
        }
    } else if (S.item === 'pipis') {
        amount = parseInt($('pipis-amount').value, 10);
        if (!amount || amount < 1 || !S.color) return null;
        note = S.color;
    } else if (S.item === 'pup') {
        if (!S.status || S.gliserin === null) return null;
        amount = 1;
        note = S.status + (S.gliserin ? ' [浣腸 / Supositoria gliserin]' : '');
    } else {
        // 運動：四項復健都要填實際完成次數
        amount = parseInt($('ex-amount').value, 10);
        if (!amount || amount < 1) return null;
    }
    note = (note ? note + ' ' : '') + '👤U' + CARE_USER;
    return { action:'insert', type:m.type, category:m.category, date, time, amount, note, recordId: rid };
}

/* ===== 漸進揭露（一→二→三→存檔→四） ===== */
function refresh(){
    toggleSection('step2', S.step1);
    toggleSection('step2b', S.step1 && !!S.type);
    ['makan','keluar','latihan','tensi'].forEach(tp => $('panel-' + tp).classList.toggle('hidden', S.type !== tp));
    if (S.type === 'makan') {
        $('quick-susu').classList.toggle('hidden', S.item !== 'susu');
        $('quick-food').classList.toggle('hidden', S.item !== 'food');
        $('amount-row').classList.toggle('hidden', !S.item);
    }
    if (S.type === 'keluar') {
        $('pipis-extra').classList.toggle('hidden', S.item !== 'pipis');
        $('pup-extra').classList.toggle('hidden', S.item !== 'pup');
    }
    if (S.type === 'latihan') {
        $('ex-extra').classList.toggle('hidden', !S.item);
    }
    const ok = !!buildPayload();
    const step3WasHidden = $('step3').classList.contains('hidden');
    toggleSection('step3', S.step1 && !!S.type && ok);
    $('need-hint').classList.toggle('hidden', !(S.step1 && S.type) || ok);
    if (ok && step3WasHidden) focusStep('step3');   // 只在剛出現時捲動，打字中不亂跳
    $('step4').classList.toggle('hidden', records.length === 0);
}
function toggleSection(id, show){
    const el = $(id);
    const wasHidden = el.classList.contains('hidden');
    el.classList.toggle('hidden', !show);
    if (show && wasHidden) { el.classList.remove('enter'); void el.offsetWidth; el.classList.add('enter'); }
}
function focusStep(id){
    document.querySelectorAll('.step').forEach(s => s.classList.remove('now'));
    const el = $(id);
    if (el && !el.classList.contains('hidden')) { el.classList.add('now'); el.scrollIntoView({ behavior:'smooth', block:'center' }); }
}

/* ===== 存檔 ===== */
function save(){
    const p = buildPayload();
    if (!p) { $('need-hint').classList.remove('hidden'); return; }
    if (p._bp) {   // 血壓合理區間：超標→大紅彈窗（不擋存檔）
        const chk = careBpViolations(p.category, p._bp.sys, p._bp.dia, p._bp.hr);
        if (chk.violations.length) {
            $('bp-modal-body').innerHTML = chk.violations.map(v =>
                `<div class="bg-red-100 border-4 border-red-500 rounded-2xl p-3">
                    <p class="text-2xl font-black text-red-700">${LANG==='zh' ? v.zh : v.id}: ${v.val}</p>
                    <p class="text-xl font-black">${t('normalRange')}: ${v.lo}–${v.hi}</p>
                </div>`).join('');
            $('bp-modal').classList.remove('hidden');
        }
        delete p._bp;
    }
    $('btn-save').disabled = true; $('btn-save').innerText = '⏳ …';
    records.unshift({ recordId:p.recordId, type:p.type, category:p.category, date:p.date, time:p.time, amount:String(p.amount), note:p.note });
    renderAll();
    fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(p) })
        .then(r => r.json())
        .then(() => { toast(t('saved')); resetToStart(); setTimeout(loadDay, 1500); })
        .catch(() => { records = records.filter(r => r.recordId !== p.recordId); renderAll(); toast(t('failed'), true); })
        .finally(() => { $('btn-save').disabled = false; $('btn-save').innerHTML = t('save'); });
}
/* 儲存後：頁面回復成只出現「步驟 1 ＋ 步驟 4（今日紀錄）」，時間重設為現在 */
function resetToStart(){
    S = { step1:false, type:null, item:null, color:null, status:null, gliserin:null, food:null };
    $('input-amount').value = ''; $('pipis-amount').value = ''; $('food-other').value = ''; $('ex-amount').value = '';
    ['bp-sys','bp-dia','bp-hr'].forEach(id => $(id).value = '');
    document.querySelectorAll('.type-btn,.item-btn').forEach(b => b.classList.remove('selected'));
    document.querySelectorAll('.food-btn,.color-btn,.status-btn,.glis-btn').forEach(b => b.classList.remove('ringed'));
    document.querySelectorAll('.ex-chip').forEach(b => b.classList.remove('selected'));
    setNowTime();
    refresh(); focusStep('step1');
}

/* ===== 四、今日全部紀錄＋刪除（外框灰色鈕，紅色留給緊急） ===== */
let delId = null;
function askDelete(id){ delId = id; $('del-modal').classList.remove('hidden'); }
function closeDel(){ delId = null; $('del-modal').classList.add('hidden'); }
function doDelete(){
    const id = delId; closeDel(); if (!id) return;
    records = records.filter(r => r.recordId !== id);
    renderAll();
    fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({ action:'markError', recordId:id }) })
        .then(r => r.json()).then(() => { toast(t('deleted')); setTimeout(loadDay, 1200); })
        .catch(() => { toast(t('failed'), true); loadDay(); });
}
function renderAll(){
    // 目標列：應紀錄目標＝雲端現值；✅＝全部人（U1–U5）攝入總和。純圖示，不用文字
    const goal = goals['goal_總攝入水量'] || '…';
    const sudah = records.filter(r => ['飲水量','服藥飲水','營養飲品','進食'].includes(r.category)).reduce((s,r) => s + (parseFloat(r.amount) || 0), 0);
    $('target-strip').innerText = `🎯 ${goal} cc ｜ ✅ ${sudah} cc`;
    const g = parseFloat(goal);
    const pct = (isFinite(g) && g > 0) ? Math.min(100, Math.round(sudah / g * 100)) : 0;
    const bar = $('strip-bar');
    bar.style.width = pct + '%';
    bar.style.background = sudah > 1200 ? 'var(--danger)' : 'var(--accent)';
    // 紀錄列：依時段分框（同管理者總表），時間一律 12 小時制＋☀️/🌙
    const SLOT_EMOJI = { dawn:'🌙', morning:'🌅', midday:'☀️', evening:'🌇', night:'🛏️', late:'💤' };
    const recRow = r => {
        const isBP = (r.category || '').includes('血壓');
        const emoji = isBP ? '❤️' : (CAT_EMOJI[r.category] || '📝');
        const unit = isBP ? '' : (['排便','仰臥抬腿','大腿內收','橋式抬臀','站立'].includes(r.category) ? t('times') : ' cc');
        const note = careNoteDisplay(r.note || '', LANG);
        return `<div class="flex items-center gap-2 border-[3px] border-gray-400 rounded-2xl p-3 bg-white">
            <div class="flex-1 min-w-0">
                <p class="text-2xl font-black">${fmt12(r.time)} ${emoji} ${r.amount}${unit}</p>
                ${note ? `<p class="text-base font-bold text-gray-600 truncate">${note}</p>` : ''}
            </div>
            <button type="button" onclick="askDelete('${r.recordId}')" class="shrink-0 w-16 h-16 rounded-2xl bg-white border-[3px] border-gray-400 text-gray-500 text-4xl font-black bigbtn leading-none">✕</button>
        </div>`;
    };
    const list = $('rec-list');
    if (records.length === 0) { list.innerHTML = `<p class="text-xl font-black text-gray-500 text-center py-4">${t('noRec')}</p>`; }
    else {
        list.innerHTML = CARE_SLOTS.map(s => {
            const recs = records.filter(r => r.time >= s.start && (s.end === '24:00' || r.time < s.end)).sort((a,b) => a.time.localeCompare(b.time));
            if (recs.length === 0) return '';
            return `<div class="border-4 border-gray-700 rounded-3xl p-2 space-y-2 bg-stone-50">
                <p class="text-2xl font-black text-gray-800 px-1">${SLOT_EMOJI[s.key] || ''} ${LANG==='zh' ? s.zh : s.id} <span class="text-base text-gray-500">${fmt12(s.start)}–${fmt12(s.end === '24:00' ? '00:00' : s.end)}</span></p>
                ${recs.map(recRow).join('')}
            </div>`;
        }).join('');
    }
    checkWarnings();
    refresh();
}

/* ===== 兒童版警示（跟大人版同規則，用小朋友看得懂的話）：
 * 喝太多(>1200cc)、尿太多(>正常上限=喝的×1.1，吃利尿藥×1.5) → 動態大紅橫幅＋每天每種跳一次大彈窗 ===== */
function checkWarnings(){
    const intake = records.filter(r => ['飲水量','服藥飲水','營養飲品','進食'].includes(r.category)).reduce((s,r) => s + (parseFloat(r.amount) || 0), 0);
    const urine = records.filter(r => r.category === '尿液').reduce((s,r) => s + (parseFloat(r.amount) || 0), 0);
    const cfg = careConfig(goals);
    const uMax = cfg.diuretic ? Math.round(intake * 1.5) : Math.round(intake * 1.1);
    const warns = [];
    if (intake > 1200) warns.push({ key:'minum', text:t('warnDrink') });
    if (urine > 0 && uMax > 0 && urine > uMax) warns.push({ key:'pipis', text:t('warnPipis') });
    $('warn-box').innerHTML = warns.map(w =>
        `<div class="alert-banner border-8 bg-red-100 rounded-3xl p-3 text-2xl font-black" style="border-color: var(--danger); color: var(--danger)"><span class="bounce-big">🚨</span> ${w.text}<br><span class="text-xl">${t('callAdult')}</span></div>`).join('');
    const date = $('input-date').value || careTodayStr();
    const fresh = warns.filter(w => !localStorage.getItem('anak_warn_' + date + '_' + w.key));
    if (fresh.length) {
        $('warn-modal-body').innerHTML = fresh.map(w => `<p class="text-3xl font-black" style="color: var(--danger)">${w.text}</p>`).join('');
        $('warn-modal').classList.remove('hidden');
        fresh.forEach(w => localStorage.setItem('anak_warn_' + date + '_' + w.key, '1'));
    }
}

/* ===== 同步：快取先渲染，背景刷新（不擋操作） ===== */
function fetchWithTimeout(url, ms){
    const ctrl = new AbortController();
    const tm = setTimeout(() => ctrl.abort(), ms);
    return fetch(url, { cache:'no-store', signal: ctrl.signal }).finally(() => clearTimeout(tm));
}
function loadDay(){
    const date = $('input-date').value || careTodayStr();
    const key = 'anak_cache_' + date;
    try { const c = JSON.parse(localStorage.getItem(key) || 'null'); if (c) { records = c.records; goals = c.goals; renderAll(); } } catch(e) {}
    $('sync-icon').classList.add('animate-spin-slow');
    const url = `${GAS_URL}?date=${date}&t=${Date.now()}`;
    fetchWithTimeout(url, 20000)
        .catch(() => fetchWithTimeout(url, 20000))
        .then(r => r.json())
        .then(data => {
            records = (data.records || []).filter(r => r.status !== '無效');
            goals = data.goals || {};
            try { localStorage.setItem(key, JSON.stringify({ records, goals, ts:Date.now() })); } catch(e) {}
            renderAll();
        })
        .catch(() => toast(t('syncFail'), true))
        .finally(() => $('sync-icon').classList.remove('animate-spin-slow'));
}

window.onload = function(){
    initClock();
    applyLang();
    // 手動輸入的欄位（cc/次數/血壓三格/自填食物）也要即時重算，儲存鈕才會出現
    ['input-amount','pipis-amount','ex-amount','bp-sys','bp-dia','bp-hr'].forEach(id => $(id).addEventListener('input', refresh));
    $('food-other').addEventListener('input', onFoodOther);
    refresh();
    focusStep('step1');
    loadDay();
};
</script>
