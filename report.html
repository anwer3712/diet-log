<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日時段報表 / Laporan Harian</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="care-tasks.js?v=9"></script>
    <style>
        body { background: linear-gradient(180deg, #fff1f2 0%, #ffffff 45%, #eff6ff 100%); }
        .animate-spin-slow { animation: spin 3s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @media print { .no-print { display: none !important; } body { background: #fff; } }
    </style>
</head>
<body class="text-gray-800 min-h-screen pb-12 font-sans">

    <div class="max-w-2xl mx-auto px-4 pt-5">

        <div class="no-print flex items-center justify-between mb-2">
            <a href="index.html" class="text-xs font-bold text-sky-600 hover:underline" id="back-link">←</a>
            <div class="flex items-center gap-1">
                <a href="trends.html" class="px-2.5 py-1 rounded-full text-[10px] font-black border bg-emerald-50 text-emerald-600 border-emerald-300">📈</a>
                <div class="flex gap-1" id="lang-switch"></div>
            </div>
        </div>

        <div class="text-center mb-3">
            <h1 class="text-xl font-black text-rose-400 tracking-wide" id="page-title">📅</h1>
        </div>

        <!-- 進度格 -->
        <div class="bg-white rounded-3xl p-3 shadow-sm border-2 border-rose-100 mb-3 overflow-x-auto">
            <div id="progress-grid"></div>
        </div>

        <!-- 日期選擇 -->
        <div class="no-print bg-white rounded-3xl p-3 shadow-sm border border-gray-100 mb-3 flex items-center gap-2">
            <button type="button" onclick="shiftDate(-1)" class="bg-gray-100 text-gray-600 px-3 py-2 rounded-2xl text-sm font-black active:scale-95">◀</button>
            <input id="report-date" type="date" class="flex-1 bg-gray-50 border-0 rounded-2xl py-2 px-3 text-sm font-bold text-gray-700 text-center" onchange="loadReport()">
            <button type="button" onclick="shiftDate(1)" class="bg-gray-100 text-gray-600 px-3 py-2 rounded-2xl text-sm font-black active:scale-95">▶</button>
        </div>

        <div id="loading" class="text-center py-6 text-gray-400 text-sm font-bold hidden"><span class="inline-block animate-spin-slow">🔄</span></div>

        <div id="report-container"></div>

        <div class="no-print mt-4 text-center">
            <button type="button" onclick="window.print()" class="bg-rose-400 hover:bg-rose-500 text-white font-black rounded-2xl py-2.5 px-6 text-sm shadow-md active:scale-95" id="print-btn">🖨️</button>
        </div>
    </div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycby-3Q--z4t03yOtgtMpkbhYccmxD9dqvmrqQdX4sg4vZNBfjgyuKYuL6HZuHkro7p0o/exec";

let LANG = careGetLang();
const L = (zh,id) => LANG==='id' ? id : (LANG==='both' ? zh+' / '+id : zh);

// 事件簡短名稱（單語）
const CAT_SHORT = {
    '飲水量':['飲水','Minum'], '服藥飲水':['服藥','Obat'], '營養飲品':['營養','Susu'], '進食':['進食','Makan'],
    '尿液':['尿液','Urine'], '排便':['排便','BAB'],
    '仰臥抬腿':['仰臥抬腿','Angkat Kaki'], '大腿內收':['大腿內收','Adduksi Paha'], '橋式抬臀':['橋式抬臀','Angkat Pinggul'],
    '雙手舉水瓶':['舉水瓶','Angkat Botol'], '腳底板抬壓':['抬腳壓','Tekan Kaki'], '膝蓋彎伸':['膝彎伸','Tekuk Lutut'], '站立':['站立','Berdiri']
};
function catShort(cat){
    if (CAT_SHORT[cat]) return L(CAT_SHORT[cat][0], CAT_SHORT[cat][1]);
    if (cat && cat.indexOf('血壓/心跳') === 0) return L('血壓','Tensi') + (cat.includes('(早)') ? L('(早)','(pagi)') : cat.includes('(晚)') ? L('(晚)','(malam)') : '');
    return cat;
}
function unitOf(cat){
    if (['排便'].concat(CARE_EX_TYPES).includes(cat)) return L('次','x');
    if (['雙手舉水瓶','腳底板抬壓','膝蓋彎伸'].includes(cat)) return L('組','set');
    if (cat && cat.indexOf('血壓') === 0) return '';
    return 'cc';
}

function renderChrome(){
    document.getElementById('page-title').textContent = '📅 ' + L('每日時段報表','Laporan Harian per Periode');
    document.getElementById('back-link').textContent = '← ' + L('回照護日誌','Kembali');
    document.getElementById('print-btn').textContent = '🖨️ ' + L('列印','Cetak');
    const sw = document.getElementById('lang-switch');
    sw.innerHTML = ['zh','id','both'].map(m =>
        `<button onclick="setLang('${m}')" class="px-2.5 py-1 rounded-full text-[10px] font-black border ${LANG===m?'bg-rose-400 text-white border-rose-400':'bg-white text-gray-500 border-gray-200'}">${m==='zh'?'中':m==='id'?'ID':'中+ID'}</button>`
    ).join('');
}
function setLang(m){ LANG = m; careSetLang(m); renderChrome(); loadReport(); }

function shiftDate(days){
    const inp = document.getElementById('report-date');
    const d = new Date(inp.value + 'T00:00:00');
    d.setDate(d.getDate() + days);
    inp.value = new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().split('T')[0];
    loadReport();
}

function loadReport(){
    const rawDate = document.getElementById('report-date').value;
    const date = /^\d{4}-\d{2}-\d{2}$/.test(rawDate) ? rawDate : careTodayStr();
    if (rawDate !== date) document.getElementById('report-date').value = date;
    const url = new URL(location); url.searchParams.set('date', date); history.replaceState(null,'',url);
    document.getElementById('loading').classList.remove('hidden');
    fetch(`${GAS_URL}?date=${date}&t=${Date.now()}`, { cache:'no-store' })
        .then(r => r.json())
        .then(data => render(date, (data.records||[]).filter(r => r.status !== '無效'), data.goals || {}))
        .catch(() => { document.getElementById('report-container').innerHTML =
            `<div class="text-center py-6 text-red-500 text-sm font-bold bg-white rounded-3xl border border-red-100">⚠️ ${L('同步失敗，請檢查網路','Sinkronisasi gagal')}</div>`; })
        .finally(() => document.getElementById('loading').classList.add('hidden'));
}

function render(date, records, goals){
    const { tasks, lateRecIds } = careComputeTasks(records, date, goals);
    careRenderGrid(document.getElementById('progress-grid'), tasks, LANG);

    let bodyRows = '';
    CARE_SLOTS.forEach(slot => {
        const recs = records
            .filter(r => careInSlot(r.time, slot))
            .sort((a,b) => a.time.localeCompare(b.time));
        const missed = tasks.filter(t => t.slot === slot.key && t.state === 'missed');
        const n = recs.length + missed.length;
        if (n === 0) return;

        const slotCell = `<td rowspan="${n}" class="align-top py-1.5 px-2 text-[10px] font-black text-gray-500 bg-gray-50/80 whitespace-nowrap border-r border-gray-100">${L(slot.zh,slot.id)}<div class="text-[8px] text-gray-300">${slot.start}-${slot.end}</div></td>`;
        let first = true;

        recs.forEach(r => {
                        const late = lateRecIds.has(r.recordId);
                        const c = late ? 'text-amber-600' : 'text-gray-700';
                        const who = careUserOfNote(r.note);
                        const note = careEscapeHtml(careStripUserTag(r.note));
                        const safeTime = careEscapeHtml(r.time);
                        const ev = `${careEscapeHtml(catShort(r.category))} ${careEscapeHtml(r.amount !== '' && r.amount !== undefined ? r.amount : '')}${unitOf(r.category) ? unitOf(r.category) : ''}`;
                        bodyRows += `<tr class="border-b border-gray-50 ${late?'bg-amber-50/60':''}">
                                        ${first ? slotCell : ''}
                                                        <td class="py-1.5 px-2 text-[11px] font-black whitespace-nowrap ${c}">${safeTime}${late?'🟧':''}</td>
                                                                        <td class="py-1.5 px-2 text-[11px] font-bold ${c}">${ev}${who?` <span class="text-[9px] text-gray-300">U${who}</span>`:''}</td>
                                                                                        <td class="py-1.5 px-2 text-[10px] ${late ? 'text-amber-500 font-bold' : 'text-gray-400'}">${late ? L('補齊','Terlambat')+(note?'｜'+note:'') : (note || '')}</td>
                                                                                                    </tr>`;
                        first = false;
        });
        missed.forEach(t => {
            bodyRows += `<tr class="border-b border-gray-50 bg-red-50/60">
                ${first ? slotCell : ''}
                <td class="py-1.5 px-2 text-[12px] font-black text-red-600">XX</td>
                <td class="py-1.5 px-2 text-[11px] font-black text-red-600">${L(t.full_zh,t.full_id)}</td>
                <td class="py-1.5 px-2 text-[10px] font-bold text-red-400">${L('未完成','Belum selesai')}</td>
            </tr>`;
            first = false;
        });
    });

    const done = tasks.filter(t=>t.state==='done').length,
          late = tasks.filter(t=>t.state==='late').length,
          miss = tasks.filter(t=>t.state==='missed').length;

    document.getElementById('report-container').innerHTML = `
    <div class="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden">
        <div class="px-3 py-2 text-[10px] font-black text-gray-400 border-b border-gray-100 flex justify-between">
            <span>${date}</span>
            <span><span class="text-green-600">✓${done}</span>　<span class="text-amber-500">補${late}</span>　<span class="text-red-600">✕${miss}</span>　${L('共','Total ')}${records.length}${L('筆','')}</span>
        </div>
        <table class="w-full text-left">
            <thead><tr class="text-[9px] text-gray-400 font-black border-b border-gray-100 bg-gray-50/50">
                <th class="py-1 px-2">${L('時間段','Periode')}</th>
                <th class="py-1 px-2">${L('記錄時間','Waktu')}</th>
                <th class="py-1 px-2">${L('記錄事件','Peristiwa')}</th>
                <th class="py-1 px-2">${L('備註','Catatan')}</th>
            </tr></thead>
            <tbody>${bodyRows || `<tr><td colspan="4" class="py-4 text-center text-[11px] text-gray-300">📭 ${L('本日尚無紀錄','Tidak ada catatan')}</td></tr>`}</tbody>
        </table>
    </div>`;
}

(function init(){
    const p = new URLSearchParams(location.search).get('date');
    document.getElementById('report-date').value = (p && /^\d{4}-\d{2}-\d{2}$/.test(p)) ? p : careTodayStr();
    renderChrome();
    loadReport();
})();
</script>
</body>
</html>
