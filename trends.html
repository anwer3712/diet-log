<style>
/* ============ 自足式樣式（本頁不依賴 Tailwind CDN，離線快取後仍可完整顯示） ============
 * 色彩依 dataviz 檢核色盤（已通過 CVD ΔE≥12 與亮度帶驗證）：
 * 系列 s1 藍 #2a78d6 / s2 湖綠 #1baf7a / s3 黃 #eda100 / s4 綠 #008300
 * 狀態（固定語意，不作系列色）：good #0ca30c / warn #fab219 / serious #ec835a / crit #d03b3b

:root{
  --s1:#2a78d6; --s2:#1baf7a; --s3:#eda100; --s4:#008300;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --ink:#0b0b0b; --ink2:#52514e; --muted:#898781; --grid:#e1e0d9; --axis:#c3c2b7;
  --card:#ffffff; --line:#f1f0ec;
}
*{ box-sizing:border-box; margin:0; padding:0; }
body{
  font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  background: linear-gradient(180deg,#fff1f2 0%,#ffffff 45%,#eff6ff 100%);

}

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycby-3Q--z4t03yOtgtMpkbhYccmxD9dqvmrqQdX4sg4vZNBfjgyuKYuL6HZuHkro7p0o/exec";

/* ===================== 語言 ===================== */
let LANG = careGetLang();
const L = (zh, id) => {
  const s = LANG === 'id' ? id : zh;
  return (typeof s === 'string' && s.indexOf('§S§') !== -1) ? s.split('§S§').join(careSubj(cloudGoals, LANG)) : s;
};

/* ===================== 色盤（dataviz 驗證通過） ===================== */
const C = {
  s1:'#2a78d6', s2:'#1baf7a', s3:'#eda100', s4:'#008300',
  s1d:'#1c5cab',                                    // 藍 550（回歸線／深階）
  good:'#0ca30c', warn:'#fab219', serious:'#ec835a', crit:'#d03b3b',
  ink:'#0b0b0b', ink2:'#52514e', muted:'#898781', grid:'#e1e0d9', axis:'#c3c2b7',
  surface:'#ffffff',
  divPos:'#e34948', divNeg:'#2a78d6'                 // 發散對：紅（滯留）↔ 藍（負平衡）
};
const wash = (hex, a) => hex + Math.round(a * 255).toString(16).padStart(2, '0');

/* ===================== 常數（與 index/anak 的 category 完全一致） ===================== */
const INTAKE_CATS = ['飲水量', '服藥飲水', '營養飲品', '進食'];
const EX7 = ['雙手舉水瓶', '腳底板抬壓', '膝蓋彎伸', '站立', '仰臥抬腿', '大腿內收', '橋式抬臀'];
const EX_SHORT = {
  '雙手舉水瓶': ['舉水瓶', 'Angkat Botol'], '腳底板抬壓': ['抬腳壓', 'Tekan Kaki'], '膝蓋彎伸': ['膝彎伸', 'Tekuk Lutut'],
  '站立': ['站立', 'Berdiri'], '仰臥抬腿': ['仰臥抬腿', 'Angkat Kaki'], '大腿內收': ['大腿內收', 'Adduksi Paha'], '橋式抬臀': ['橋式抬臀', 'Angkat Pinggul']
};
const DISTAL_EX = ['雙手舉水瓶', '腳底板抬壓', '膝蓋彎伸'];       // 末梢神經肌肉控制項目
const LOAD_W = { '站立': 3, '橋式抬臀': 2.5, '大腿內收': 2, '仰臥抬腿': 1.5 };   // 大肌群負荷加權 [需獨立驗證]
const INTAKE_MIN = 1100, INTAKE_MAX = 1500;                       // 限水安全區間（cc）
const BP_SYS_WARN = 130, BP_DIA_WARN = 80, PP_WARN = 60;          // 血壓/脈壓差警戒
const RPP_SAFE = 10000, RPP_DANGER = 12000;                       // RPP 分級 [需獨立驗證]

/* ===================== 雲端讀取與快取 =====================
 * GAS 僅支援單日查詢（?date=YYYY-MM-DD），趨勢頁逐日抓取後存 localStorage：
 * 今日永遠重抓；近 3 日快取 6 小時（照顧者常補登）；更早快取 7 天。🔄 可強制全部重抓。 */
const CACHE_PREFIX = 'care_trend_v1_';
const GOALS_KEY = 'care_trend_goals_v1';
function cacheTTL(dateStr){
  const today = careTodayStr();
  if (dateStr >= today) return 0;
  const age = (new Date(today) - new Date(dateStr)) / 86400000;
  return age <= 3 ? 6 * 3600e3 : 7 * 86400e3;
}
function cacheGet(dateStr){
  try {
    const raw = localStorage.getItem(CACHE_PREFIX + dateStr);
    if (!raw) return null;
    const obj = JSON.parse(raw);
    const ttl = cacheTTL(dateStr);
    if (!ttl || Date.now() - obj.t > ttl) return null;
    return obj.r.map(x => ({ category: x[0], time: x[1], amount: x[2], note: x[3] }));
  } catch (e) { return null; }
}
function cacheSet(dateStr, records){
  try {
    localStorage.setItem(CACHE_PREFIX + dateStr,
      JSON.stringify({ t: Date.now(), r: records.map(r => [r.category, r.time, r.amount, r.note]) }));
  } catch (e) { /* 容量滿：放棄快取即可 */ }
}
function cachePrune(){
  const cutoff = new Date(new Date(careTodayStr()) - 70 * 86400000).toISOString().split('T')[0];
  const drop = [];
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.startsWith(CACHE_PREFIX) && k.slice(CACHE_PREFIX.length) < cutoff) drop.push(k);
  }
  drop.forEach(k => localStorage.removeItem(k));
}

let cloudGoals = {};
try { cloudGoals = (JSON.parse(localStorage.getItem(GOALS_KEY) || 'null') || {}).g || {}; } catch (e) {}
const weatherByDate = {};   // P5：龍潭每日氣象（GAS getRecords 回應附帶）；date→{temp,rh,pressure,pm25,wbgt}

async function fetchDay(dateStr){
  const res = await fetch(`${GAS_URL}?date=${dateStr}&t=${Date.now()}`, { cache: 'no-store' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json();
  const records = (data.records || []).filter(r => r.status !== '無效')
    .map(r => ({ category: r.category, time: r.time, amount: r.amount, note: r.note }));
  if (data.goals) {
    cloudGoals = data.goals;
    try { localStorage.setItem(GOALS_KEY, JSON.stringify({ t: Date.now(), g: data.goals })); } catch (e) {}
  }
  if (data.weather) weatherByDate[dateStr] = data.weather;   // P5：GAS 未供 weather 前恆 undefined，安全略過
  cacheSet(dateStr, records);
  return records;
}

/* 併發池：最多 5 條同時，逐日回報進度 */
async function loadRange(dates, force, onProgress){
  const out = {}; const failed = [];
  let done = 0;
  const queue = dates.slice();
  async function worker(){
    while (queue.length) {
      const d = queue.shift();
      let recs = force ? null : cacheGet(d);
      if (!recs) {
        try { recs = await fetchDay(d); }
        catch (e1) {
          try { recs = await fetchDay(d); }               // 失敗重試一次
          catch (e2) { recs = null; failed.push(d); }
        }
      }
      out[d] = recs;                                       // null = 讀取失敗（圖上留缺口）
      done++; onProgress(done, dates.length);
    }
  }
  await Promise.all(Array.from({ length: Math.min(5, dates.length) }, worker));
  return { byDate: out, failed };
}

/* ===================== 每日彙整 ===================== */
function parseBP(amount){
  const m = String(amount == null ? '' : amount).match(/\d+/g);
  if (!m || m.length < 3) return null;
  const sys = +m[0], dia = +m[1], hr = +m[2];
  if (sys < 60 || sys > 260 || dia < 30 || dia > 200 || hr < 25 || hr > 230 || dia >= sys) return null;
  return { sys, dia, hr };
}
const avg = arr => arr.length ? arr.reduce((s, v) => s + v, 0) / arr.length : null;
const rnd = v => v == null ? null : Math.round(v);

function summarizeDay(dateStr, records){
  const d = {
    date: dateStr, has: false, failed: records === null,
    intake: null, urine: null, stool: null, net: null, urMin: null, urMax: null, diuretic: false, diureticAux: false,
    stoolMarks: { hard: false, loose: false, enema: false, lax: false }, laxPills: 0, stoolGoal: null, stoolNotes: [],
    ex: {}, exPct: {}, overallPct: null, distalPct: null, load: null,
    am: null, pm: null, ppAm: null, ppPm: null, rppAm: null, rppPm: null, dHr: null
  };
  if (!records || !records.length) return d;
  d.has = true;

  let intake = 0, urine = 0, stool = 0;
  const cat = { water: 0, med: 0, nutri: 0, food: 0 };
  EX7.forEach(e => d.ex[e] = 0);
  const bp = { am: [], pm: [] };

  records.forEach(r => {
    const amt = parseFloat(r.amount) || 0;
    const note = r.note || '';
    if (INTAKE_CATS.includes(r.category)) { intake += amt;
      if (r.category === '飲水量') cat.water += amt; else if (r.category === '服藥飲水') cat.med += amt; else if (r.category === '營養飲品') cat.nutri += amt; else if (r.category === '進食') cat.food += amt; }
    else if (r.category === '尿液') {
      urine += amt;
      if (/利尿藥物\s*[（(]輔助[）)]/.test(note)) d.diureticAux = true;
      else if (note.includes('利尿藥物')) d.diuretic = true;
    }
    else if (r.category === '排便') {
      stool += 1;
      if (/乾硬|keras/i.test(note)) d.stoolMarks.hard = true;
      if (/稀便|水便|encer|diare/i.test(note)) d.stoolMarks.loose = true;
      if (/浣腸|supositoria/i.test(note)) d.stoolMarks.enema = true;
      if (note.includes('利便藥物')) d.stoolMarks.lax = true;
      const mLax = /利便藥物\s*(\d+)\s*顆/.exec(note);
      if (mLax) d.laxPills = Math.max(d.laxPills, parseInt(mLax[1], 10));
      else if (d.stoolMarks.lax) d.laxPills = Math.max(d.laxPills, 1);
      const txt = careNoteDisplay(note, LANG);
      if (txt) d.stoolNotes.push((r.time || '') + ' ' + txt);
    }
    else if (EX7.includes(r.category)) d.ex[r.category] += amt;
    else if ((r.category || '').includes('血壓/心跳')) {
      const v = parseBP(r.amount);
      if (v) ((r.category.includes('(早)')) ? bp.am : bp.pm).push(v);
    }
  });

  d.intake = Math.round(intake);
  d.urine = Math.round(urine);
  d.stool = stool;
  d.net = d.intake - d.urine;
  // 尿量演算法（care-tasks.js 共用）：已達攝入 ×0.9；利尿藥物（輔助）×1.1；利尿藥物 ×1.3
  d.urMin = d.urMax = careUrineGoal(intake, d.diuretic ? 'full' : (d.diureticAux ? 'aux' : null));
  d.stoolGoal = careStoolGoal(d.laxPills);

  ['am', 'pm'].forEach(k => {
    if (bp[k].length) d[k] = {
      sys: rnd(avg(bp[k].map(v => v.sys))), dia: rnd(avg(bp[k].map(v => v.dia))), hr: rnd(avg(bp[k].map(v => v.hr))), n: bp[k].length
    };
  });
  if (d.am) { d.ppAm = d.am.sys - d.am.dia; d.rppAm = d.am.sys * d.am.hr; }
  if (d.pm) { d.ppPm = d.pm.sys - d.pm.dia; d.rppPm = d.pm.sys * d.pm.hr; }
  if (d.am && d.pm) d.dHr = d.pm.hr - d.am.hr;

  const pcts = [], distal = [];
  EX7.forEach(e => {
    const goal = parseFloat(cloudGoals['goal_' + e]) || 0;
    const p = goal > 0 ? Math.round(d.ex[e] / goal * 100) : null;
    d.exPct[e] = p;
    if (p != null) { pcts.push(p); if (DISTAL_EX.includes(e)) distal.push(p); }
  });
  d.overallPct = pcts.length ? Math.round(avg(pcts)) : null;
  d.distalPct = distal.length ? Math.round(avg(distal)) : null;
  d.load = Object.keys(LOAD_W).reduce((s, e) => s + LOAD_W[e] * (d.ex[e] || 0), 0);
  d.cat = { water: Math.round(cat.water), med: Math.round(cat.med), nutri: Math.round(cat.nutri), food: Math.round(cat.food) };
  d.weather = weatherByDate[d.date] || null;   // P5：氣象（無則 null，P4 網絡層安全略過）
  if (d.weather && d.weather.wbgt == null && typeof estimateWBGT === 'function')
    d.weather.wbgt = estimateWBGT(d.weather.temp, d.weather.rh);
  return d;
}

/* 圖例鍵自訂：線圖用 2px 色線、柱圖用色塊、散點標記保留原形狀；
 * 預設產生器會沿用資料點的白色描邊（pointBorderColor），把線鍵畫成白色而看不見 */
Chart.defaults.plugins.legend.labels.generateLabels = function(chart){
  return chart.data.datasets.map((ds, i) => {
    const type = ds.type || chart.config.type;
    const isLine = type === 'line';
    const isBar = type === 'bar';
    const color = isLine ? ds.borderColor : (typeof ds.backgroundColor === 'string' ? ds.backgroundColor : ds.borderColor);
    return {
      text: ds.label || '', datasetIndex: i, hidden: !chart.isDatasetVisible(i),
      pointStyle: isBar ? 'rectRounded' : (isLine ? 'line' : (ds.pointStyle || 'circle')),
      rotation: ds.rotation || 0,
      fillStyle: color, strokeStyle: color,
      lineWidth: isLine ? (ds.borderWidth || 2) : (type === 'scatter' && ds.pointStyle === 'crossRot' ? 2.5 : 0),
      lineDash: ds.borderDash || [],
      fontColor: C.ink2
    };
  }).filter(l => l.text);
};

/* 十字準線：index 模式提示框啟用時，畫一條貼齊資料點的縱向細線 */
const crosshair = {
  id: 'crosshair',
  afterDraw(chart){
    const tt = chart.tooltip;
    if (!tt || !tt.opacity || !tt.dataPoints || !tt.dataPoints.length) return;
    if (chart.config.type === 'radar') return;
    const x = tt.dataPoints[0].element.x;
    const { top, bottom } = chart.chartArea;
    const ctx = chart.ctx;
    ctx.save();
    ctx.strokeStyle = wash(C.ink, 0.22); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x, top); ctx.lineTo(x, bottom); ctx.stroke();
    ctx.restore();
  }
};

/* 標籤襯底：警戒線／色帶標籤壓在資料線上時，先鋪一層半透明表面色保持可讀 */
function labelChip(ctx, x, y, w, h){
  ctx.fillStyle = 'rgba(255,255,255,.86)';
  if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(x, y, w, h, 4); ctx.fill(); }
  else ctx.fillRect(x, y, w, h);
}

/* 水平警戒線：options.plugins.hlines = [{y, color, label, dash}] */
const hlines = {
  id: 'hlines',
  afterDatasetsDraw(chart, args, opts){
    const lines = (opts && opts.lines) || [];
    if (!lines.length) return;
    const { left, right, top, bottom } = chart.chartArea;
    const yS = chart.scales.y; const ctx = chart.ctx;
    ctx.save();
    lines.forEach(ln => {
      const y = yS.getPixelForValue(ln.y);
      if (y < top - 1 || y > bottom + 1) return;
      ctx.strokeStyle = ln.color; ctx.lineWidth = 1.5; ctx.setLineDash(ln.dash || [5, 4]);
      ctx.beginPath(); ctx.moveTo(left, y); ctx.lineTo(right, y); ctx.stroke();
      if (ln.label) {
        ctx.setLineDash([]);
        ctx.font = '800 9px system-ui, sans-serif';
        const tw = ctx.measureText(ln.label).width;
        const ty = Math.max(top + 9, y - 5);
        labelChip(ctx, right - tw - 19, ty - 10, tw + 17, 13);
        ctx.strokeStyle = ln.color; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(right - tw - 16, ty - 3); ctx.lineTo(right - tw - 8, ty - 3); ctx.stroke();
        ctx.fillStyle = C.ink2; ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
        ctx.fillText(ln.label, right - tw - 5, ty + 2);
      }
    });
    ctx.restore();
  }
};

/* 水平色帶（狀態語意區）：options.plugins.zones = [{from, to, color, label}]
 * 色帶鋪在資料後面（beforeDatasetsDraw）、標籤畫在資料上面（afterDatasetsDraw）＋襯底 */
function zoneRect(chart, z){
  const { top, bottom } = chart.chartArea;
  const yS = chart.scales.y;
  let y1 = z.to == null ? top : yS.getPixelForValue(z.to);
  let y2 = z.from == null ? bottom : yS.getPixelForValue(z.from);
  y1 = Math.max(top, Math.min(bottom, y1));
  y2 = Math.max(top, Math.min(bottom, y2));
  return { y1, y2 };
}
const zones = {
  id: 'zones',
  beforeDatasetsDraw(chart, args, opts){
    const zs = (opts && opts.bands) || [];
    if (!zs.length) return;
    const { left, right } = chart.chartArea;
    const ctx = chart.ctx;
    ctx.save();
    zs.forEach(z => {
      const { y1, y2 } = zoneRect(chart, z);
      if (y2 - y1 < 2) return;
      ctx.fillStyle = z.color;
      ctx.fillRect(left, y1, right - left, y2 - y1);
    });
    ctx.restore();
  },
  afterDatasetsDraw(chart, args, opts){
    const zs = (opts && opts.bands) || [];
    if (!zs.length) return;
    const { right } = chart.chartArea;
    const ctx = chart.ctx;
    ctx.save();
    zs.forEach(z => {
      const { y1, y2 } = zoneRect(chart, z);
      if (!z.label || y2 - y1 <= 14) return;
      ctx.font = '800 8.5px system-ui, sans-serif';
      const tw = ctx.measureText(z.label).width;
      labelChip(ctx, right - tw - 8, y1 + 2, tw + 6, 12);
      ctx.fillStyle = C.muted; ctx.textAlign = 'right'; ctx.textBaseline = 'top';
      ctx.fillText(z.label, right - 4, y1 + 3);
    });
    ctx.restore();
  }
};

/* 依日期變動的目標帶（例：每日尿量目標下限～上限）：options.plugins.vband = {lo:[], hi:[], color, edge} */
const vband = {
  id: 'vband',
  beforeDatasetsDraw(chart, args, opts){
    if (!opts || !opts.lo) return;
    const { lo, hi } = opts;
    const xS = chart.scales.x, yS = chart.scales.y, ctx = chart.ctx;
    const { top, bottom } = chart.chartArea;
    const pts = [];
    lo.forEach((v, i) => { if (v != null) pts.push({ x: xS.getPixelForValue(i), lo: yS.getPixelForValue(v), hi: yS.getPixelForValue((hi && hi[i] != null) ? hi[i] : v) }); });
    if (pts.length < 2) return;
    const clamp = y => Math.max(top, Math.min(bottom, y));
    ctx.save();
    ctx.fillStyle = opts.color;
    ctx.beginPath();
    pts.forEach((p, i) => i ? ctx.lineTo(p.x, clamp(p.hi)) : ctx.moveTo(p.x, clamp(p.hi)));
    for (let i = pts.length - 1; i >= 0; i--) ctx.lineTo(pts[i].x, clamp(pts[i].lo));
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = opts.edge; ctx.lineWidth = 1.5; ctx.setLineDash([5, 4]);
    ctx.beginPath();
    pts.forEach((p, i) => i ? ctx.lineTo(p.x, clamp(p.lo)) : ctx.moveTo(p.x, clamp(p.lo)));
    ctx.stroke();
    ctx.restore();
  }
};
Chart.register(crosshair, hlines, zones, vband);

const isolatedDot = ctx => {
  const arr = ctx.dataset.data, i = ctx.dataIndex;
  if (arr[i] == null) return 0;
  const prev = i > 0 ? arr[i - 1] : null, next = i < arr.length - 1 ? arr[i + 1] : null;

};

}

  });

  const tv = document.getElementById('jp-thirdvars');
  tv.innerHTML = '';
  THIRD_VARS.forEach(v => {
    const chip = jpChip(L(v.zh, v.idn), jpTV.has(v.id));
    if (jpFocus && v.applies.includes(jpFocus)) chip.classList.add('rel');
    chip.addEventListener('click', () => { jpTV.has(v.id) ? jpTV.delete(v.id) : jpTV.add(v.id); renderBuilder(); applyInterpretations(); });
    tv.appendChild(chip);
  });
  // 軸3：病患疾病 chips（來源＝admin-settings 存的 careUI(cloudGoals).diseases；預設全開一次）
  const dxHost = document.getElementById('jp-diseases');
  const dxLabelEl = document.getElementById('jp-dx-label');
  const patientDx = (typeof careUI === 'function' ? (careUI(cloudGoals).diseases || []) : []);
  if (!jpDxInit && patientDx.length){ patientDx.forEach(id => jpDx.add(id)); jpDxInit = true; }
  if (dxHost && dxLabelEl){
    if (patientDx.length && typeof DX_BY_ID !== 'undefined'){
      dxLabelEl.style.display = ''; dxHost.style.display = '';
      dxLabelEl.textContent = L('疊加病患疾病（可複選，預設全開）：', 'Tambah penyakit pasien (multi, default semua):');
      dxHost.innerHTML = '';
      patientDx.forEach(id => {
        const d = DX_BY_ID[id]; if (!d) return;
        const chip = jpChip('🩺 ' + (LANG === 'id' ? d.idn : d.zh), jpDx.has(id));
        chip.addEventListener('click', () => { jpDx.has(id) ? jpDx.delete(id) : jpDx.add(id); renderBuilder(); applyInterpretations(); });
        dxHost.appendChild(chip);
      });
    } else {
      dxLabelEl.style.display = 'none'; dxHost.style.display = 'none';
      dxLabelEl.textContent = ''; dxHost.innerHTML = '';
    }
  }
  updateJpHint();
}
function applyFocus(){
  document.querySelectorAll('#charts .card').forEach(sec => {

function updateJpHint(){
  const h = document.getElementById('jp-hint');
  if (!h) return;
  const sel = THIRD_VARS.filter(v => jpTV.has(v.id));
  const dxSel = (typeof DX_BY_ID !== 'undefined') ? [...jpDx].map(id => DX_BY_ID[id]).filter(Boolean) : [];
  if (!sel.length && !dxSel.length){
    h.textContent = L('（未加變數/疾病：只看基礎研判。到「管理設定」勾選病患疾病後，這裡會多出可疊加的病名。）',
                      '(Belum ada variabel/penyakit. Pilih penyakit di Pengaturan untuk menambah faktor.)');

  }
  const tvNames = sel.map(v => L(v.zh, v.idn)).join('、');
  const dxNames = dxSel.map(d => L(d.zh, d.idn)).join('、');
  const parts = [];
  if (tvNames) parts.push(L('變數：<b>' + tvNames + '</b>', 'Variabel: <b>' + tvNames + '</b>'));
  if (dxNames) parts.push(L('疾病：<b>' + dxNames + '</b>', 'Penyakit: <b>' + dxNames + '</b>'));
  h.innerHTML = parts.join('｜') + L(
    '。相關圖下方會出現紫色「🧩 整合研判」卡，四段：①變動（實證：條件成立/不成立日的數值差）②為什麼（機制）③影響總結（變數＋疾病整合，非相加）④建議（非處方照護行動）。跨圖組合另見下方 🔗 綜合研判卡。',
    '. Kartu ungu "🧩" muncul di bawah grafik terkait: ①Perubahan ②Sebab ③Dampak terpadu ④Saran (bukan resep).');

/* 表格檢視（相容色弱／列印／無障礙的等值管道）— 一律 textContent，不插 HTML */
function fillTable(cardId, headers, rows){
  const box = document.getElementById(cardId + '-tbl');
  box.innerHTML = '';
  const table = document.createElement('table');
  const thead = document.createElement('thead');
  const trh = document.createElement('tr');
  headers.forEach((h, i) => {
    const th = document.createElement('th');
    th.textContent = h; if (i) th.className = 'num';
    trh.appendChild(th);
  });
  thead.appendChild(trh); table.appendChild(thead);
  const tbody = document.createElement('tbody');
  rows.forEach(r => {
    const tr = document.createElement('tr');
    r.forEach((v, i) => {
      const td = document.createElement('td');
      td.textContent = v == null ? '—' : String(v); if (i) td.className = 'num';
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody); box.appendChild(table);
}

/* ===================== ⑧ 運動負荷 vs 晚間恢復（散點＋回歸） ===================== */
function buildC8(){
  const pts = DAYS.filter(d => d.has && d.dHr != null).map(d => ({ x: d.load, y: d.dHr, date: d.date }));
  if (pts.length < 3) return showEmpty('c8-box', 'c8');
  let reg = null;
  if (pts.length >= 5) {
    const n = pts.length;
    const sx = pts.reduce((s, p) => s + p.x, 0), sy = pts.reduce((s, p) => s + p.y, 0);
    const sxx = pts.reduce((s, p) => s + p.x * p.x, 0), sxy = pts.reduce((s, p) => s + p.x * p.y, 0);
    const syy = pts.reduce((s, p) => s + p.y * p.y, 0);
    const den = n * sxx - sx * sx;
    if (den > 1e-9) {
      const b = (n * sxy - sx * sy) / den, a = (sy - b * sx) / n;
      const rDen = Math.sqrt(den * (n * syy - sy * sy));
      reg = { a, b, r: rDen > 1e-9 ? (n * sxy - sx * sy) / rDen : 0 };
    }
  }
  const xMax = Math.ceil(Math.max(...pts.map(p => p.x), 10) * 1.12 / 10) * 10;
  const ds = [{
    type: 'scatter', label: L('單日（負荷, 晚−早心跳）', 'Per hari (beban, Δdetak)'),
    data: pts, backgroundColor: C.s1, borderColor: C.surface, borderWidth: 2,
    pointRadius: 5, pointHoverRadius: 7, pointHitRadius: 16
  }];
  if (reg) ds.push({
    type: 'line', label: L('回歸趨勢', 'Garis regresi'),
    data: [{ x: 0, y: reg.a }, { x: xMax, y: reg.a + reg.b * xMax }],
    borderColor: C.s1d, borderWidth: 2, borderDash: [6, 4], pointRadius: 0, pointHitRadius: 0, pointStyle: 'line'
  });
  mkChart('c8', {
    type: 'scatter',
    data: { datasets: ds },
    options: {
      interaction: { mode: 'nearest', intersect: false },
      scales: {
        x: { min: 0, max: xMax, grid: gridY(), title: axisTitle(L('大肌群運動負荷積分', 'Skor beban latihan')) },
        y: { suggestedMin: -18, suggestedMax: 18,
             grid: { color: ctx => ctx.tick.value === 0 ? C.axis : C.grid, lineWidth: ctx => ctx.tick.value === 0 ? 1.5 : 1 },
             title: axisTitle(L('晚間心跳 − 早晨心跳（次/分）', 'Detak malam − pagi (x/menit)')) }
      },
      plugins: {
        tooltip: { filter: it => it.datasetIndex === 0, callbacks: {
          title: its => its.length ? dayTitle(its[0].raw.date) : '',
          label: it => [
            ' ' + L('負荷積分 ', 'Beban ') + fmtN(it.parsed.x),
            ' Δ' + L('心跳 ', 'detak ') + (it.parsed.y > 0 ? '+' : '') + fmtN(it.parsed.y) + ' ' + L('次/分', 'x/menit')
          ]
        }}
      }
    }
  });
  document.getElementById('c8-note').innerHTML =
    L('負荷積分＝站立×3＋橋式抬臀×2.5＋大腿內收×2＋仰臥抬腿×1.5（權重假設，[需獨立驗證]）。' +
      '<b>0 線上方＝晚間心跳高於早晨</b>：若高負荷日的點持續落在上方，代表該強度已引發交感神經亢奮、夜間恢復不良，隔日應下修復健目標。' +
      (reg ? '　目前相關係數 r = ' + reg.r.toFixed(2) + '（n=' + pts.length + '）。' : ''),
      'Skor beban = Berdiri×3 + Angkat Pinggul×2,5 + Adduksi×2 + Angkat Kaki×1,5 [perlu verifikasi mandiri]. <b>Di atas garis 0 = detak malam lebih tinggi dari pagi</b> → kurangi target besok.' +
      (reg ? ' r = ' + reg.r.toFixed(2) + ' (n=' + pts.length + ').' : ''));
  fillTable('c8',
    [L('日期', 'Tanggal'), L('負荷積分', 'Skor beban'), L('心跳(早)', 'Detak pagi'), L('心跳(晚)', 'Detak malam'), 'Δ'],
    DAYS.filter(d => d.has).map(d => [dayLabel(d.date), fmtN(d.load), d.am && d.am.hr, d.pm && d.pm.hr,
      d.dHr == null ? null : (d.dHr > 0 ? '+' : '') + d.dHr]));
}

/* ===================== 隱藏變數分析引擎（純函式，不碰 document/L/LANG/Chart，可獨立單元測試） ===================== */
function median(arr){
  const s = [...arr].sort((a, b) => a - b);
  const mid = Math.floor(s.length / 2);
  return s.length % 2 ? s[mid] : (s[mid - 1] + s[mid]) / 2;
}

function analyzeRange(DAYS){
  const days = DAYS.filter(d => d.has);
  const n = days.length;
  const mean = vals => avg(vals.filter(v => v != null));
  const countDays = pred => days.filter(pred).length;
  const trailRun = pred => {
    let c = 0;
    for (let i = days.length - 1; i >= 0; i--) { if (pred(days[i])) c++; else break; }
    return c;
  };
  const trend = get => {
    const vals = days.map(get).filter(v => v != null);
    if (vals.length < 4) return 0;
    const half = Math.floor(vals.length / 2);
    return (mean(vals.slice(vals.length - half)) || 0) - (mean(vals.slice(0, half)) || 0);
  };

  /* ---- 共用訊號（perChart 與 hidden 共用同一份計算結果，避免重算） ---- */
  const over = countDays(d => d.intake > INTAKE_MAX);
  const retainRun = trailRun(d => d.net > 0);
  const netTrend = trend(d => d.net);
  const lowUrine = countDays(d => d.intake > 0 && d.urine < d.urMin);

  const hiAm = countDays(d => d.am && d.am.sys > 150);
  const hiPm = countDays(d => d.pm && d.pm.sys > 140);
  const nonDip = countDays(d => d.am && d.pm && d.pm.sys >= d.am.sys);
  const sysTrend = trend(d => d.am ? d.am.sys : null);   // 目前規則未直接引用，保留供未來擴充

  const hrs = days.flatMap(d => [d.am && d.am.hr, d.pm && d.pm.hr].filter(x => x != null));
  const swing = hrs.length ? Math.max(...hrs) - Math.min(...hrs) : 0;
  const spike = countDays(d => (d.am && (d.am.hr > 100 || d.am.hr < 55)) || (d.pm && (d.pm.hr > 100 || d.pm.hr < 55)));

  const c4hiRun = trailRun(d => d.overallPct != null && d.overallPct > 120);
  const c4loRun = trailRun(d => d.overallPct != null && d.overallPct < 60);
  const overallDays = days.filter(d => d.overallPct != null);
  const c4latest = overallDays.length ? overallDays[overallDays.length - 1].overallPct : null;

  const hard = countDays(d => d.stoolMarks.hard);
  const loose = countDays(d => d.stoolMarks.loose);
  const hardWithDiur = countDays(d => d.stoolMarks.hard && (d.diuretic || d.diureticAux));
  let maxGap = 0, gapCur = 0;
  days.forEach(d => { if (d.stool === 0) { gapCur++; maxGap = Math.max(maxGap, gapCur); } else gapCur = 0; });

  const ppHi = countDays(d => (d.ppAm != null && d.ppAm > PP_WARN) || (d.ppPm != null && d.ppPm > PP_WARN));
  const ppTrend = trend(d => d.ppAm);

  const red = countDays(d => (d.rppAm != null && d.rppAm > RPP_DANGER) || (d.rppPm != null && d.rppPm > RPP_DANGER));
  const amber = countDays(d => (d.rppAm != null && d.rppAm > RPP_SAFE && d.rppAm <= RPP_DANGER) || (d.rppPm != null && d.rppPm > RPP_SAFE && d.rppPm <= RPP_DANGER));
  const rppTrend = trend(d => d.rppAm);

  const c8pts = days.filter(d => d.dHr != null);
  const c8median = c8pts.length ? median(c8pts.map(p => p.load)) : 0;
  const highLoadUp = c8pts.filter(p => p.load >= c8median && p.dHr > 0).length;
  const upDays = c8pts.filter(p => p.dHr > 0).length;

  const nearLow = countDays(d => d.intake > 0 && d.intake <= INTAKE_MIN);
  const distalTrend = trend(d => d.distalPct);
  const bothLowDrop = countDays(d => d.intake > 0 && d.intake <= INTAKE_MIN && d.distalPct != null && d.distalPct < 100);

  /* ---- ①～⑨ 每圖動態判讀 ---- */
  const perChart = { c1: null, c2: null, c3: null, c4: null, c5: null, c6: null, c7: null, c8: null, c9: null };

  if (days.some(d => d.intake || d.urine)) {
    if (retainRun >= 2 && netTrend > 0) {
      const last = days[days.length - 1];
      perChart.c1 = { level: 'serious',
        zh: `<b>近${retainRun}日液體連日淨滯留且擴大</b>（最新淨值 +${Math.round(last.net)} cc）。滯留持續推升血壓、水腫與心腎負荷，請回報醫師評估利尿劑是否足夠。`,
        id: `<b>Retensi cairan ${retainRun} hari beruntun & membesar</b> (selisih terbaru +${Math.round(last.net)} cc). Lapor dokter untuk cek dosis diuretik.` };
    } else if (over >= 2) {
      perChart.c1 = { level: 'warn',
        zh: `區間內有 ${over} 天總攝入超過上限 1,500 cc；限水未達標會加重容積負荷。`,
        id: `${over} hari asupan melebihi batas 1.500 cc; kelebihan cairan menambah beban.` };
    } else if (lowUrine >= Math.ceil(n / 2) && n >= 3) {
      perChart.c1 = { level: 'warn',
        zh: `多數日子尿量低於目標（${lowUrine}/${n} 天），注意利尿反應或腎功能，回診時提出。`,
        id: `Urine di bawah target pada ${lowUrine}/${n} hari; perhatikan respons diuretik/ginjal.` };
    } else {
      perChart.c1 = { level: 'good',
        zh: `區間內進出大致平衡，維持目前限水節奏即可。`,
        id: `Keseimbangan cairan cukup baik; pertahankan pembatasan air.` };
    }
  }

  if (days.some(d => d.am || d.pm)) {
    if ((hiAm + hiPm) >= Math.ceil(n / 2) && n >= 3) {
      perChart.c2 = { level: 'serious',
        zh: `<b>血壓多日偏高</b>（晨>150：${hiAm} 天／晚>140：${hiPm} 天）。檢視降壓藥 24 小時覆蓋，回報醫師。`,
        id: `<b>Tensi tinggi beberapa hari</b> (pagi>150: ${hiAm}; malam>140: ${hiPm}). Tinjau obat 24 jam.` };
    } else if (nonDip >= Math.ceil(n * 0.6) && n >= 4) {
      perChart.c2 = { level: 'serious',
        zh: `<b>夜間血壓不降（non-dipping）</b>：${nonDip}/${n} 天晚間收縮壓≥晨間。夜間高壓與心血管風險相關，建議回報。`,
        id: `<b>Tensi malam tidak turun</b>: ${nonDip}/${n} hari. Terkait risiko kardiovaskular; lapor dokter.` };
    } else if (hiAm >= 1 || hiPm >= 1) {
      perChart.c2 = { level: 'warn',
        zh: `偶見血壓越過醫囑上限（晨>150 ${hiAm} 天／晚>140 ${hiPm} 天），留意當日誘因並持續記錄。`,
        id: `Sesekali tensi lewat batas (pagi ${hiAm}, malam ${hiPm} hari); catat pemicunya.` };
    } else {
      perChart.c2 = { level: 'good',
        zh: `血壓晨昏節律穩定，落在醫囑區間內。`,
        id: `Ritme tensi stabil dalam kisaran anjuran.` };
    }
  }

  if (hrs.length) {
    if (spike >= 1 && swing >= 25) {
      perChart.c3 = { level: 'serious',
        zh: `<b>心跳大幅震盪</b>（區間內 ${Math.min(...hrs)}–${Math.max(...hrs)} 次/分，並有 ${spike} 天出現異常尖峰）。永久性心律不整下請以「波動」而非單點判讀，異常尖峰回報。`,
        id: `<b>Detak jantung berfluktuasi tajam</b> (${Math.min(...hrs)}–${Math.max(...hrs)} x/menit; ${spike} hari lonjakan abnormal). Lapor dokter.` };
    } else if (swing >= 25) {
      perChart.c3 = { level: 'warn',
        zh: `心跳波動偏大（${Math.min(...hrs)}–${Math.max(...hrs)} 次/分）；留意劇烈上下震盪的日子與其誘因。`,
        id: `Fluktuasi detak agak besar (${Math.min(...hrs)}–${Math.max(...hrs)} x/menit).` };
    } else {
      perChart.c3 = { level: 'good',
        zh: `靜息心跳大致平穩。`,
        id: `Detak istirahat relatif stabil.` };
    }
  }

  if (overallDays.length) {
    if (c4hiRun >= 2) {
      perChart.c4 = { level: 'warn',
        zh: `<b>連 ${c4hiRun} 日達標率 >120%</b>（最新 ${c4latest}%）。慎防復健過度，隔日可下修目標。`,
        id: `<b>${c4hiRun} hari beruntun >120%</b> (terbaru ${c4latest}%). Hati-hati latihan berlebih.` };
    } else if (c4loRun >= 2) {
      perChart.c4 = { level: 'warn',
        zh: `<b>連 ${c4loRun} 日達標率 <60%</b>（最新 ${c4latest}%）。檢視體力耐受或執行落差，必要時調整目標。`,
        id: `<b>${c4loRun} hari beruntun <60%</b> (terbaru ${c4latest}%). Evaluasi tenaga/pelaksanaan.` };
    } else {
      perChart.c4 = { level: 'good',
        zh: `復健達標率落在合理範圍，維持目前強度。`,
        id: `Capaian rehab dalam rentang wajar.` };
    }
  }

  if (days.length) {
    if (maxGap >= 3) {
      perChart.c5 = { level: 'serious',
        zh: `<b>連續 ${maxGap} 天無排便</b>，接近便秘警報（60–72 小時）。留意腹脹與水分/軟便劑配比。`,
        id: `<b>${maxGap} hari tanpa BAB</b>, mendekati alarm sembelit. Perhatikan cairan/pencahar.` };
    } else if (hard >= 2) {
      perChart.c5 = { level: 'warn',
        zh: `乾硬便 ${hard} 天${hardWithDiur >= 1 ? `（其中 ${hardWithDiur} 天當日有利尿藥物）` : ''}。利尿劑可能過度吸走腸道水分，回診時討論配比。`,
        id: `Feses keras ${hard} hari${hardWithDiur >= 1 ? ` (${hardWithDiur} hari ada diuretik)` : ''}. Diuretik mungkin menyerap air usus.` };
    } else if (loose >= 2) {
      perChart.c5 = { level: 'warn',
        zh: `稀/水便 ${loose} 天，可能軟便劑偏重；觀察是否需減量。`,
        id: `Feses encer ${loose} hari; mungkin pencahar terlalu kuat.` };
    } else {
      perChart.c5 = { level: 'good',
        zh: `排便節律大致正常。`,
        id: `Ritme BAB relatif normal.` };
    }
  }

  if (days.length) {
    if (ppHi >= 1 && retainRun >= 2 && ppTrend > 0) {
      perChart.c6 = { level: 'serious',
        zh: `<b>脈壓差擴大（>60 有 ${ppHi} 天）＋液體連日滯留</b>同時出現，是利尿劑不足以克服容積負荷的早期組合訊號，建議回報心臟/腎臟科。`,
        id: `<b>Tekanan nadi melebar (>${PP_WARN}: ${ppHi} hari) + retensi cairan</b> — sinyal dini diuretik kurang. Lapor dokter jantung/ginjal.` };
    } else if (ppHi >= 2) {
      perChart.c6 = { level: 'warn',
        zh: `脈壓差有 ${ppHi} 天 >60 mmHg，反映動脈硬化/容積負荷，持續觀察。`,
        id: `Tekanan nadi >60 pada ${ppHi} hari; pantau terus.` };
    } else {
      perChart.c6 = { level: 'good',
        zh: `脈壓差與滯留在可接受範圍。`,
        id: `Tekanan nadi & retensi dalam batas wajar.` };
    }
  }

  if (days.some(d => d.rppAm != null || d.rppPm != null)) {
    if (red >= 1) {
      perChart.c7 = { level: 'serious',
        zh: `<b>RPP 進入紅區 ${red} 天</b>（心肌耗氧過載）。即使血壓、心跳單看未越界，乘積過高代表心臟高耗氧做白工，回報心臟科。`,
        id: `<b>RPP masuk zona merah ${red} hari</b> (beban oksigen jantung berlebih). Lapor dokter jantung.` };
    } else if (amber >= Math.ceil(n / 2) && n >= 3) {
      perChart.c7 = { level: 'warn',
        zh: `RPP 多在警戒黃區（${amber} 天），心肌負荷偏高${rppTrend > 0 ? `且呈上升` : ''}，持續留意。`,
        id: `RPP sering di zona kuning (${amber} hari)${rppTrend > 0 ? `, cenderung naik` : ''}.` };
    } else {
      perChart.c7 = { level: 'good',
        zh: `心肌耗氧指標大致落在安全區。`,
        id: `RPP umumnya di zona aman.` };
    }
  }

  if (c8pts.length >= 5 && highLoadUp >= 3) {
    perChart.c8 = { level: 'serious',
      zh: `<b>多日高運動負荷日晚間心跳持續未降</b>（${highLoadUp} 天負荷偏高且晚>早）。反覆的夜間交感亢奮、恢復不良會累積心臟負擔，建議下修復健強度並回報醫師。`,
      id: `<b>Detak malam berulang kali tidak turun pada hari beban tinggi</b> (${highLoadUp} hari). Kurangi intensitas & lapor dokter.` };
  } else if (c8pts.length >= 5 && highLoadUp >= 2) {
    perChart.c8 = { level: 'warn',
      zh: `<b>高運動負荷日晚間心跳未降</b>（${highLoadUp} 天負荷偏高且晚>早）。提示該強度引發交感亢奮、夜間恢復不良，隔日宜下修復健目標。`,
      id: `<b>Detak malam tidak turun pada hari beban tinggi</b> (${highLoadUp} hari). Kurangi target besok.` };
  } else if (c8pts.length >= 3 && upDays >= Math.ceil(c8pts.length * 0.6)) {
    perChart.c8 = { level: 'warn',
      zh: `多數日子晚間心跳高於早晨（${upDays}/${c8pts.length} 天），留意整體恢復與睡眠。`,
      id: `Detak malam > pagi pada ${upDays}/${c8pts.length} hari; perhatikan pemulihan.` };
  } else if (c8pts.length < 3) {
    perChart.c8 = null;
  } else {
    perChart.c8 = { level: 'good',
      zh: `運動負荷與夜間心跳恢復關係尚屬平穩。`,
      id: `Hubungan beban–pemulihan malam relatif stabil.` };
  }

  if (days.some(d => d.intake) && days.some(d => d.distalPct != null)) {
    if (nearLow >= 2 && distalTrend < 0 && bothLowDrop >= 1) {
      perChart.c9 = { level: 'serious',
        zh: `<b>攝入貼近下限＋末梢肌力同步下滑</b>（${nearLow} 天攝入≤1,100 cc，末梢達標率下降）。在嚴格限水下這常是隱性脫水或低血鈉/低血鉀的最早訊號，建議回報醫師檢視電解質。`,
        id: `<b>Asupan mendekati batas bawah + otot distal menurun</b> (${nearLow} hari ≤1.100 cc). Tanda awal dehidrasi/elektrolit; lapor dokter.` };
    } else if (distalTrend < 0) {
      perChart.c9 = { level: 'warn',
        zh: `末梢小肌群達標率呈下滑趨勢，留意是否伴隨脫水或疲勞。`,
        id: `Capaian otot distal menurun; waspadai dehidrasi/kelelahan.` };
    } else {
      perChart.c9 = { level: 'good',
        zh: `末梢肌力與水分攝入關係穩定。`,
        id: `Otot distal & hidrasi stabil.` };
    }
  }

  /* ---- 跨圖隱藏變數組合（most-severe first：crit > serious > warn） ---- */
  const hidden = [];
  if (retainRun >= 2 && ppHi >= 1 && (over >= 1 || lowUrine >= 1)) {
    hidden.push({ level: 'serious',
      zh: `🫀 <b>身體可能「水太多、排不掉」</b>：這幾天喝進去的水一直排不出來、累積在體內（圖⑥①），血管被撐得脈壓差變大（圖⑥）${over >= 1 ? `，還有幾天喝超過上限（圖①）` : `，加上尿量偏少（圖①）`}。合起來看，可能是<b>循環裡的水分過載、利尿效果不夠</b>，心臟和腎臟會比較累。👉 回診把這幾天的攝入、尿量、血壓給心臟科或腎臟科看，問利尿藥要不要調整。[需獨立驗證]`,
      id: `🫀 <b>Tubuh mungkin "kebanyakan air, sulit dibuang"</b>: cairan menumpuk di tubuh (grafik ⑥①) & tekanan nadi melebar (grafik ⑥)${over >= 1 ? `, ada hari asupan lewat batas (grafik ①)` : `, urine sedikit (grafik ①)`}. Mungkin <b>volume sirkulasi berlebih / diuretik kurang</b>; jantung & ginjal lebih lelah. 👉 Tunjukkan asupan, urine, tensi ke dokter jantung/ginjal, tanyakan dosis diuretik. [perlu verifikasi mandiri]` });
  }
  if (highLoadUp >= 2 && nonDip >= Math.ceil(n * 0.6) && n >= 4) {
    hidden.push({ level: 'serious',
      zh: `🌙 <b>晚上身體「靜不下來」</b>：運動量大的日子，晚上心跳沒有降回來（圖⑧），血壓晚上該降卻也沒降（圖②）。合起來看，可能是<b>神經整晚太亢奮、夜間休息時身體沒有真正放鬆下來</b>。👉 先把復健強度調輕一點，回診時請心臟科一起看夜間血壓。[需獨立驗證]`,
      id: `🌙 <b>Malam hari tubuh "tak bisa tenang"</b>: di hari beban tinggi, detak malam tak turun (grafik ⑧) & tensi malam juga tak turun (grafik ②). Mungkin <b>saraf terlalu aktif semalaman, tubuh tak benar-benar beristirahat</b>. 👉 Kurangi intensitas latihan; minta dokter jantung menilai tensi malam. [perlu verifikasi mandiri]` });
  }
  if (red >= 1 && (ppHi >= 1 || swing >= 25)) {
    hidden.push({ level: 'crit',
      zh: `🔥 <b>心臟在「做白工」、比較耗氧</b>：血壓乘心跳衝進紅區（圖⑦），同時${ppHi >= 1 ? `血管脈壓差也變大（圖⑥）` : `心跳大幅忽快忽慢（圖③）`}。重點是——<b>就算血壓、心跳分開看都還在範圍內，合起來心臟的負擔已經偏重，有缺血風險</b>。這是最需要留意的一項。👉 盡快回報心臟科，問心律藥和血壓藥要怎麼搭配。[需獨立驗證]`,
      id: `🔥 <b>Jantung "bekerja sia-sia", boros oksigen</b>: tensi×detak masuk zona merah (grafik ⑦)${ppHi >= 1 ? `, tekanan nadi melebar (grafik ⑥)` : `, detak sangat berfluktuasi (grafik ③)`}. Meski tensi & detak terpisah masih normal, gabungannya = beban jantung berat, ada risiko iskemia. Ini paling perlu diperhatikan. 👉 Segera lapor dokter jantung soal kombinasi obat. [perlu verifikasi mandiri]` });
  }
  if (nearLow >= 2 && (distalTrend < 0 || hard >= 2)) {
    hidden.push({ level: 'serious',
      zh: `💧 <b>可能「表面喝夠、其實偏乾」</b>：這幾天喝的量貼近下限（圖①⑨），同時${distalTrend < 0 ? `手腳末梢的力氣悄悄變小（圖⑨）` : `大便變乾硬（圖⑤）`}。合起來看，可能是<b>隱性脫水，或血鈉、血鉀偏低</b>——帳面上喝夠了，身體卻不夠水。👉 回診請醫師驗一下電解質，並問限水的下限能不能放寬。[需獨立驗證]`,
      id: `💧 <b>Mungkin "cukup di angka, tapi kering di tubuh"</b>: asupan mendekati batas bawah (grafik ①⑨), sekaligus ${distalTrend < 0 ? `otot tangan/kaki melemah (grafik ⑨)` : `feses makin keras (grafik ⑤)`}. Mungkin <b>dehidrasi tersembunyi atau natrium/kalium rendah</b>. 👉 Minta dokter cek elektrolit & tanyakan apakah batas bawah air bisa dilonggarkan. [perlu verifikasi mandiri]` });
  }
  if (hardWithDiur >= 1 && countDays(d => d.net < 0) >= 2) {
    hidden.push({ level: 'warn',
      zh: `💊 <b>利尿藥可能「連腸子的水也一起帶走」</b>：有利尿藥的日子大便偏乾硬（圖⑤），加上好幾天排出比喝進去還多（圖⑥）。合起來看，<b>利尿藥在排水的同時，可能把腸道需要的水分也帶走了，造成便秘</b>。👉 回診跟醫師討論利尿藥和軟便劑的比例、以及喝水時間怎麼分配。[需獨立驗證]`,
      id: `💊 <b>Diuretik mungkin "ikut menarik air usus"</b>: di hari ada diuretik feses keras (grafik ⑤), plus beberapa hari keluar lebih banyak dari masuk (grafik ⑥). Mungkin <b>diuretik ikut membawa air yang dibutuhkan usus → sembelit</b>. 👉 Diskusikan rasio diuretik/pencahar & waktu minum dengan dokter. [perlu verifikasi mandiri]` });
  }
  if (countDays(d => d.am && d.am.sys < 110) >= 2 && countDays(d => (d.am && d.am.hr < 55) || (d.pm && d.pm.hr < 55)) >= 1) {
    hidden.push({ level: 'warn',
      zh: `⚠️ <b>藥可能「作用過頭了」</b>：血壓連續幾天偏低（圖②），心跳也掉到 55 以下（圖③）。合起來看，可能是<b>降壓藥或心律藥的劑量相對偏強</b>。要特別小心站起來時頭暈、跌倒。👉 回診請醫師評估是不是要減量。[需獨立驗證]`,
      id: `⚠️ <b>Obat mungkin "terlalu kuat"</b>: tensi rendah beberapa hari (grafik ②) & detak di bawah 55 (grafik ③). Mungkin <b>dosis obat tensi/aritmia relatif berlebih</b>. Hati-hati pusing saat berdiri & jatuh. 👉 Minta dokter menilai apakah perlu menurunkan dosis. [perlu verifikasi mandiri]` });
  }
  // P4 定性影響圖（跨圖 N:M，疾病感知加層）：range 級訊號→driver 旗標→care-clinical.propagate。
  // 只在有選中疾病(jpDx)時加層；純 driver 匯聚已由上面 hidden 規則覆蓋。
  if (typeof propagate === 'function' && typeof jpDx !== 'undefined' && jpDx.size){
    const driverFlags = {
      retain: retainRun >= 2, widePP: ppHi >= 1, highIntake: over >= 1, lowUrine: lowUrine >= 1,
      nearLowIntake: nearLow >= 2,
      dehydrationSign: nearLow >= 1 && (distalTrend < 0 || hard >= 1),
      hardStool: hard >= 2, nonDip: n >= 4 && nonDip >= Math.ceil(n * 0.6),
      highRPP: red >= 1, distalWeak: distalTrend < 0,
      lowBP: countDays(d => d.am && d.am.sys < 110) >= 2,
      brady: countDays(d => (d.am && d.am.hr < 55) || (d.pm && d.pm.hr < 55)) >= 1,
      coldSnap: false, humidLowPressure: false, highWBGT: false, highPM25: false, bigTempSwing: false
    };
    // P5：氣象資料流入後（d.weather 存在）覆寫氣象旗標；目前無 d.weather → 全 false 安全跳過
    const wd = days.filter(d => d.weather);
    if (wd.length){
      const anyW = f => wd.some(f);
      driverFlags.coldSnap = anyW(d => d.weather.temp != null && d.weather.temp <= 12);
      driverFlags.highWBGT = anyW(d => d.weather.wbgt != null && d.weather.wbgt >= 31);
      driverFlags.highPM25 = anyW(d => d.weather.pm25 != null && d.weather.pm25 >= 35);
      driverFlags.humidLowPressure = anyW(d => d.weather.rh != null && d.weather.rh >= 80 && d.weather.pressure != null && d.weather.pressure <= 1005);
      const temps = wd.map(d => d.weather.temp).filter(x => x != null);
      driverFlags.bigTempSwing = temps.length >= 2 && (Math.max(...temps) - Math.min(...temps)) >= 8;
    }
    propagate(driverFlags, [...jpDx]).forEach(it => hidden.push({ level: it.level, zh: it.zh, id: it.id }));
  }
  const rank = { crit: 0, serious: 1, warn: 2 };
  hidden.sort((a, b) => rank[a.level] - rank[b.level]);

  return { perChart, hidden };
}

/* ===================== 主流程 ===================== */

function fmtMD(ds){ const p = (ds || '').split('-'); return p.length === 3 ? (+p[1]) + '/' + (+p[2]) : ds; }
/* 每圖「數據舉例」：找當區間最能說明問題的那一天＋數值（純資料格式化，不下醫療結論） */
function chartExample(cardId, DAYS){
  const days = DAYS.filter(d => d.has);
  if (!days.length) return null;
  const md = d => fmtMD(d.date);
  const best = keyfn => days.reduce((b, d) => { const v = keyfn(d); return v == null ? b : (b == null || v > keyfn(b) ? d : b); }, null);
  switch (cardId) {
    case 'c1': { const d = best(x => x.net); if (!d || d.net == null) return null;
      return { zh: `📅 例：${md(d)} 喝進 ${d.intake}cc、尿出 ${d.urine}cc → 當天${d.net >= 0 ? '水分滯留 +' : '淨排出 '}${Math.abs(Math.round(d.net))}cc`,
               id: `📅 Contoh: ${md(d)} minum ${d.intake}cc, urine ${d.urine}cc → ${d.net >= 0 ? 'retensi +' : 'defisit '}${Math.abs(Math.round(d.net))}cc` }; }
    case 'c2': { const d = best(x => x.am ? x.am.sys : null); if (!d || !d.am) return null;
      return { zh: `📅 例：${md(d)} 晨血壓 ${d.am.sys}/${d.am.dia}${d.pm ? `、晚 ${d.pm.sys}/${d.pm.dia}` : ''}`,
               id: `📅 Contoh: ${md(d)} tensi pagi ${d.am.sys}/${d.am.dia}${d.pm ? `, malam ${d.pm.sys}/${d.pm.dia}` : ''}` }; }
    case 'c3': { let d = null, ex = -1, hr = null;
      days.forEach(x => { [x.am && x.am.hr, x.pm && x.pm.hr].forEach(h => { if (h != null) { const e = Math.abs(h - 70); if (e > ex) { ex = e; d = x; hr = h; } } }); });
      if (!d) return null;
      return { zh: `📅 例：${md(d)} 心跳 ${hr} 次/分`, id: `📅 Contoh: ${md(d)} detak ${hr} x/menit` }; }
    case 'c4': { const d = best(x => x.overallPct == null ? null : -x.overallPct); if (!d || d.overallPct == null) return null;
      return { zh: `📅 例：${md(d)} 復健達標率 ${d.overallPct}%`, id: `📅 Contoh: ${md(d)} capaian rehab ${d.overallPct}%` }; }
    case 'c5': { const d = [...days].reverse().find(x => x.stoolMarks.hard || x.stoolMarks.loose || x.stool === 0) || best(x => -x.stool);
      if (!d) return null;
      const st = d.stoolMarks.hard ? (LANG === 'id' ? 'feses keras' : '乾硬便') : d.stoolMarks.loose ? (LANG === 'id' ? 'feses encer' : '稀水便') : d.stool === 0 ? (LANG === 'id' ? 'tidak BAB' : '無排便') : (LANG === 'id' ? `BAB ${d.stool}x` : `排便 ${d.stool} 次`);
      return { zh: `📅 例：${md(d)} ${st}`, id: `📅 Contoh: ${md(d)} ${st}` }; }
    case 'c6': { const d = best(x => Math.max(x.ppAm == null ? -1 : x.ppAm, x.ppPm == null ? -1 : x.ppPm)); if (!d) return null;
      const pp = Math.max(d.ppAm == null ? -1 : d.ppAm, d.ppPm == null ? -1 : d.ppPm); if (pp < 0) return null;
      return { zh: `📅 例：${md(d)} 脈壓差 ${pp} mmHg${d.net != null ? `、當天淨${d.net >= 0 ? '滯留 +' : '排 '}${Math.abs(Math.round(d.net))}cc` : ''}`,
               id: `📅 Contoh: ${md(d)} tekanan nadi ${pp} mmHg` }; }
    case 'c7': { const d = best(x => Math.max(x.rppAm == null ? -1 : x.rppAm, x.rppPm == null ? -1 : x.rppPm)); if (!d) return null;
      const isPm = (d.rppPm || 0) > (d.rppAm || 0); const bp = isPm ? d.pm : d.am; const rpp = isPm ? d.rppPm : d.rppAm; if (!bp || rpp == null) return null;
      return { zh: `📅 例：${md(d)} ${bp.sys}×${bp.hr}＝RPP ${Math.round(rpp / 100) / 10}k（${isPm ? '晚' : '晨'}）`,
               id: `📅 Contoh: ${md(d)} ${bp.sys}×${bp.hr}=RPP ${Math.round(rpp / 100) / 10}k` }; }
    case 'c8': { const pts = days.filter(x => x.dHr != null); if (!pts.length) return null;
      const d = pts.reduce((b, x) => (b == null || x.load > b.load ? x : b), null);
      return { zh: `📅 例：${md(d)} 運動量 ${Math.round(d.load)}、晚−晨心跳 ${d.dHr >= 0 ? '+' : ''}${d.dHr}`,
               id: `📅 Contoh: ${md(d)} beban ${Math.round(d.load)}, detak malam−pagi ${d.dHr >= 0 ? '+' : ''}${d.dHr}` }; }
    case 'c9': { const d = best(x => x.intake ? -x.intake : null); if (!d || !d.intake) return null;
      return { zh: `📅 例：${md(d)} 攝入 ${d.intake}cc${d.distalPct != null ? `、末梢達標 ${d.distalPct}%` : ''}`,
               id: `📅 Contoh: ${md(d)} asupan ${d.intake}cc${d.distalPct != null ? `, otot distal ${d.distalPct}%` : ''}` }; }
    case 'c10': { const d = best(x => x.net); if (!d || d.net == null || !d.am) return null;
      return { zh: `📅 例：${md(d)} 淨滯留 ${d.net >= 0 ? '+' : ''}${Math.round(d.net)}cc、當天晨收縮 ${d.am.sys}`, id: `📅 ${md(d)} retensi ${Math.round(d.net)}cc, tensi pagi ${d.am.sys}` }; }
    case 'c11': { const d = best(x => x.ppAm); if (!d || d.ppAm == null) return null;
      return { zh: `📅 例：${md(d)} 晨脈壓差 ${d.ppAm}${d.am ? `、舒張 ${d.am.dia}` : ''}`, id: `📅 ${md(d)} tekanan nadi ${d.ppAm}${d.am ? `, diastolik ${d.am.dia}` : ''}` }; }
    case 'c12': { const mh = x => { const hs = [x.am && x.am.hr, x.pm && x.pm.hr].filter(v => v != null); return hs.length ? Math.min(...hs) : null; }; const d = best(x => { const m = mh(x); return m == null ? null : -m; }); if (!d) return null;
      return { zh: `📅 例：${md(d)} 最低心跳 ${mh(d)}${d.am ? `、晨收縮 ${d.am.sys}` : ''}`, id: `📅 ${md(d)} detak min ${mh(d)}${d.am ? `, tensi ${d.am.sys}` : ''}` }; }
    case 'c13': { const d = best(x => (x.overallPct != null && x.distalPct != null) ? (x.overallPct - x.distalPct) : null); if (!d || d.distalPct == null) return null;
      return { zh: `📅 例：${md(d)} 核心 ${d.overallPct}% vs 末梢 ${d.distalPct}%`, id: `📅 ${md(d)} inti ${d.overallPct}% vs distal ${d.distalPct}%` }; }
    case 'c14': { const rm = x => { const r = Math.max(x.rppAm == null ? -1 : x.rppAm, x.rppPm == null ? -1 : x.rppPm); return r < 0 ? null : r; }; const d = best(x => rm(x)); if (!d || rm(d) == null) return null;
      return { zh: `📅 例：${md(d)} 運動負荷 ${Math.round(d.load)}、最高RPP ${Math.round(rm(d) / 100) / 10}k`, id: `📅 ${md(d)} beban ${Math.round(d.load)}, RPP ${Math.round(rm(d) / 100) / 10}k` }; }
    case 'c15': { let g = 0, worst = null; days.forEach(x => { if (x.stool === 0) g++; else g = 0; if (worst == null || g > worst.g) worst = { d: x, g }; }); if (!worst || worst.g === 0) return null;
      return { zh: `📅 例：${md(worst.d)} 已連續 ${worst.g} 天沒排便、當天攝入 ${worst.d.intake}cc`, id: `📅 ${md(worst.d)} ${worst.g} hari tanpa BAB, asupan ${worst.d.intake}cc` }; }
  }
  return null;
}
/* ---- 第三變數量化交互（P3）：把某圖關鍵指標依第三變數分組對照，算「加 c 後的額外風險」 ---- */
const METRIC_LABEL = {
  c1: ['淨滯留', 'cc', 'retensi'], c2: ['晨收縮壓', '', 'tensi pagi'], c3: ['心跳偏離70', '', 'deviasi detak'],
  c4: ['達標率', '%', 'capaian'], c5: ['排便', '次', 'BAB'], c6: ['脈壓差', 'mmHg', 'tekanan nadi'],
  c7: ['RPP', 'k', 'RPP'], c8: ['晚−晨心跳', '', 'Δ detak'], c9: ['末梢達標', '%', 'otot distal'],
  c10: ['淨滯留', 'cc', 'retensi'], c11: ['脈壓差', 'mmHg', 'nadi'], c12: ['最低心跳', '', 'detak min'], c13: ['末梢達標', '%', 'distal'], c14: ['RPP', 'k', 'RPP']
};
function chartMetric(cardId, d){
  switch (cardId) {
    case 'c1': return d.net;
    case 'c2': return d.am ? d.am.sys : null;
    case 'c3': { const hs = [d.am && d.am.hr, d.pm && d.pm.hr].filter(x => x != null); return hs.length ? Math.max(...hs.map(h => Math.abs(h - 70))) : null; }
    case 'c4': return d.overallPct;
    case 'c5': return d.stool;
    case 'c6': { const p = Math.max(d.ppAm == null ? -999 : d.ppAm, d.ppPm == null ? -999 : d.ppPm); return p <= -999 ? null : p; }
    case 'c7': { const r = Math.max(d.rppAm == null ? -1 : d.rppAm, d.rppPm == null ? -1 : d.rppPm); return r < 0 ? null : Math.round(r / 100) / 10; }
    case 'c8': return d.dHr;
    case 'c9': return d.distalPct;
    case 'c10': return d.net;
    case 'c11': return d.ppAm;
    case 'c12': { const hs = [d.am && d.am.hr, d.pm && d.pm.hr].filter(x => x != null); return hs.length ? Math.min(...hs) : null; }
    case 'c13': return d.distalPct;
    case 'c14': { const r = Math.max(d.rppAm == null ? -1 : d.rppAm, d.rppPm == null ? -1 : d.rppPm); return r < 0 ? null : Math.round(r / 100) / 10; }
  }
  return null;
}
function tvClassify(tvId, d){
  switch (tvId) {
    case 'diur':  return { has: !!(d.diuretic || d.diureticAux) };
    case 'lax':   return { has: !!(d.laxPills > 0 || d.stoolMarks.lax) };
    case 'stool': return { has: !!(d.stoolMarks.hard || d.stoolMarks.loose) };
    case 'exvol': return { val: d.load || 0 };
    case 'foodw': return { val: d.intake ? Math.round((d.cat ? d.cat.food : 0) / d.intake * 100) : 0 };
    case 'medw':  return { val: d.cat ? d.cat.med : 0 };
    case 'eat':   return { val: d.cat ? d.cat.food : 0 };
    default: return {};
  }
}
/* 舊 per-變數卡（tvRiskNote / TV_ADVICE / thirdVarRisk）已由 care-clinical.js 的三軸整合引擎
 * clinicalIntegrate() ＋ 本檔 computeEmpirical() 取代；chartMetric/tvClassify/METRIC_LABEL 仍被 computeEmpirical 複用。 */
const LEVEL_TAG = { good: '🟢', warn: '🟡', serious: '🟠', crit: '🔴' };

/* 三軸實證層：算本圖指標「所選變數條件全成立日 vs 全不成立日」的均差（joint），
 * 聯合資料不足(<2天任一側)時退回各變數邊際差(marginals)。供 care-clinical.clinicalIntegrate 的①變動用。
 * 複用既有 chartMetric / tvClassify / METRIC_LABEL / THIRD_VARS；slot(時段) 無中位可分組故排除。 */
function computeEmpirical(cardId, tvIds, DAYS){
  const ml = METRIC_LABEL[cardId] || ['指標', '', 'indikator'];
  const has = DAYS.filter(d => d.has && chartMetric(cardId, d) != null);
  const usableTVs = (tvIds || []).filter(t => t !== 'slot');
  const mean = a => a.length ? Math.round(a.reduce((s, x) => s + x, 0) / a.length * 10) / 10 : null;
  const medians = {};
  usableTVs.forEach(tv => {
    const vals = has.map(d => tvClassify(tv, d).val).filter(v => v !== undefined).sort((a, b) => a - b);
    if (vals.length) medians[tv] = vals[Math.floor(vals.length / 2)];
  });
  const dayMeetsTV = (tv, d) => {
    const c = tvClassify(tv, d);
    if (c.has !== undefined) return !!c.has;
    if (c.val !== undefined && medians[tv] !== undefined) return c.val > medians[tv];
    return false;
  };
  let joint = null;
  if (usableTVs.length){
    const hi = [], lo = [];
    has.forEach(d => {
      const flags = usableTVs.map(tv => dayMeetsTV(tv, d));
      if (flags.every(x => x)) hi.push(chartMetric(cardId, d));
      else if (flags.every(x => !x)) lo.push(chartMetric(cardId, d));
    });
    if (hi.length >= 2 && lo.length >= 2){
      const A = mean(hi), B = mean(lo);
      joint = { n: hi.length, A, B, diff: Math.round((A - B) * 10) / 10 };
    }
  }
  const marginals = usableTVs.map(tv => {
    const hi = [], lo = [];
    has.forEach(d => { (dayMeetsTV(tv, d) ? hi : lo).push(chartMetric(cardId, d)); });
    if (hi.length < 1 || lo.length < 1) return null;
    const A = mean(hi), B = mean(lo);
    const nm = THIRD_VARS.find(v => v.id === tv) || { zh: tv, idn: tv };
    return { tvZh: nm.zh, tvIdn: nm.idn, n: hi.length, A, B, diff: Math.round((A - B) * 10) / 10 };
  }).filter(Boolean);
  return { metricLabel: ml, joint, marginals };
}

        el.style.display = '';

      // 三軸整合卡：本圖 × 選中第三變數 × 病患疾病 → 一張四段研判（取代舊的並排單變數卡）
      let integ = null;
      const activeTVs = THIRD_VARS.filter(tv => jpTV.has(tv.id) && tv.applies.includes(c.id)).map(tv => tv.id);

      if ((activeTVs.length || activeDx.length) && typeof clinicalIntegrate === 'function'){
        integ = clinicalIntegrate({ cardId: c.id, tvIds: activeTVs, dxIds: activeDx,

      }
      if (!v && !eg && !integ) { fp.style.display = 'none'; fp.innerHTML = ''; }
      else {
        fp.style.display = '';

        if (eg) html += `<div class="fp fp-eg">${LANG === 'id' ? eg.id : eg.zh}</div>`;

  const body = document.getElementById('synth-body');
  // 說明列：這張卡＝固定跨圖規則逐條比對，不是 15 圖總結
  const expl = `<p class="synth-expl">${L(
    'ℹ️ 這裡不是 15 張圖的總結：系統內建數條固定「跨圖交叉規則」，每條同時檢查 2–3 張圖的條件（文內標了是哪幾張圖），該區間內全部成立才會亮出來，依嚴重度排序。沒亮＝那個危險組合目前沒出現。若在上方建構器勾選了病患疾病，會再加上 🕸️「跨系統網絡」研判（多因子 N:M＋疾病敏化，屬定性知識網絡、非機率貝氏預測，需醫師判讀）。',
    'ℹ️ Bukan ringkasan 15 grafik: aturan silang tetap, tiap aturan memeriksa kondisi 2–3 grafik sekaligus; hanya muncul bila semua terpenuhi, diurut berdasarkan tingkat keparahan. Bila penyakit pasien dipilih di atas, ditambah analisis 🕸️ "jaringan lintas-sistem" (N:M + sensitisasi penyakit; kualitatif, bukan prediksi probabilistik).')}</p>`;
  if (!A.hidden.length) {
    body.innerHTML = expl + `<div class="synth-item lv-good"><span class="tag">🟢</span>${
      L('目前跨圖未出現需要留意的變數組合。', 'Belum ada kombinasi variabel yang perlu diperhatikan.')}</div>`;
  } else {
    body.innerHTML = expl + A.hidden.map(v =>
      `<div class="synth-item lv-${v.level}"><span class="tag">${LEVEL_TAG[v.level]}</span>${(LANG === 'id' ? v.id : v.zh).replace('👉', '<br>👉')}</div>`
    ).join('');
  }
}

/* ===================== ⑩ 淨滯留 vs 晨收縮壓 ===================== */
function buildC10(){
  if (!DAYS.some(d => d.has && d.net != null && d.am)) return showEmpty('c10-box', 'c10');
  mkChart('c10', {
    type: 'bar',
    data: { labels: labels(), datasets: [
      { type: 'line', label: L('晨收縮壓', 'Tensi pagi'), data: DAYS.map(d => d.am ? d.am.sys : null), borderColor: C.crit, backgroundColor: C.crit, yAxisID: 'y', tension: 0.3, spanGaps: true, pointRadius: 2, borderWidth: 2 },
      { type: 'bar', label: L('淨滯留', 'Retensi'), data: DAYS.map(d => d.has ? d.net : null), backgroundColor: DAYS.map(d => d.has && d.net > 0 ? wash(C.divPos, 0.8) : wash(C.divNeg, 0.65)), yAxisID: 'y1', maxBarThickness: 20, borderRadius: 3 }
    ]},
    options: {
      interaction: { mode: 'index', intersect: false },
      scales: {
        x: { grid: { display: false }, ticks: xTicks() },
        y: { position: 'left', suggestedMin: 110, suggestedMax: 165, grid: gridY(), title: axisTitle('mmHg') },
        y1: { position: 'right', grid: { display: false }, title: axisTitle(L('淨滯留 cc', 'Retensi cc')) }
      },
      plugins: { tooltip: { callbacks: { title: ttTitle } }, hlines: { lines: [ { y: 150, color: C.crit, label: L('收縮 150', 'Atas 150') } ] } }
    }
  });
  document.getElementById('c10-note').innerHTML = L('紅線＝晨收縮壓（左，警戒150），柱＝淨滯留（右，紅正藍負）。滯留高的日子血壓也高＝水分在推血壓。', 'Garis=tensi pagi (kiri, waspada 150), batang=retensi (kanan). Sama-sama tinggi = cairan menaikkan tensi.');
  fillTable('c10', [L('日期', 'Tgl'), L('晨收縮', 'Tensi pagi'), L('淨滯留 cc', 'Retensi')], DAYS.map(d => [dayLabel(d.date), d.am ? d.am.sys : null, d.has ? (d.net > 0 ? '+' : '') + fmtN(d.net) : null]));
}
/* ===================== ⑪ 脈壓差 vs 舒張壓 ===================== */
function buildC11(){
  if (!DAYS.some(d => d.ppAm != null || (d.am && d.am.dia != null))) return showEmpty('c11-box', 'c11');
  mkChart('c11', {
    type: 'line',
    data: { labels: labels(), datasets: [
      lineDS(L('晨脈壓差', 'Nadi pagi'), DAYS.map(d => d.ppAm != null ? d.ppAm : null), C.s1),
      lineDS(L('晨舒張壓', 'Diastolik pagi'), DAYS.map(d => d.am ? d.am.dia : null), C.s4)
    ]},
    options: {
      interaction: { mode: 'index', intersect: false },
      scales: { x: { grid: { display: false }, ticks: xTicks() }, y: { suggestedMin: 30, suggestedMax: 100, grid: gridY(), title: axisTitle('mmHg') } },
      plugins: { tooltip: { callbacks: { title: ttTitle, label: it => ' ' + fmtN(it.parsed.y) + ' mmHg　' + it.dataset.label } }, hlines: { lines: [ { y: PP_WARN, color: C.crit, label: L('脈壓警戒 60', 'Nadi 60') } ] } }
    }
  });
  document.getElementById('c11-note').innerHTML = L('藍線＝脈壓差（警戒>60），綠線＝舒張壓。<b>脈壓變寬＋舒張偏低</b>是血管硬化的組合，回診請醫師確認。', 'Biru=tekanan nadi (>60 waspada), hijau=diastolik. Nadi lebar + diastolik rendah = arteriosklerosis.');
  fillTable('c11', [L('日期', 'Tgl'), L('晨脈壓差', 'Nadi pagi'), L('晨舒張', 'Diastolik')], DAYS.map(d => [dayLabel(d.date), d.ppAm != null ? d.ppAm : null, d.am ? d.am.dia : null]));
}
/* ===================== ⑫ 心搏過緩 vs 低血壓 ===================== */
function buildC12(){
  const minHr = d => { const hs = [d.am && d.am.hr, d.pm && d.pm.hr].filter(x => x != null); return hs.length ? Math.min(...hs) : null; };
  if (!DAYS.some(d => d.has && (minHr(d) != null || d.am))) return showEmpty('c12-box', 'c12');
  mkChart('c12', {
    type: 'line',
    data: { labels: labels(), datasets: [
      lineDS(L('最低心跳', 'Detak min'), DAYS.map(d => d.has ? minHr(d) : null), C.crit),
      lineDS(L('晨收縮壓', 'Tensi pagi'), DAYS.map(d => d.am ? d.am.sys : null), C.s1)
    ]},
    options: {
      interaction: { mode: 'index', intersect: false },
      scales: { x: { grid: { display: false }, ticks: xTicks() }, y: { suggestedMin: 45, suggestedMax: 160, grid: gridY(), title: axisTitle(L('次/分 · mmHg', 'x/mnt · mmHg')) } },
      plugins: { tooltip: { callbacks: { title: ttTitle } }, hlines: { lines: [ { y: 55, color: C.crit, label: L('心跳 55', 'Detak 55') }, { y: 110, color: C.axis, label: L('收縮 110', 'Tensi 110') } ] } }
    }
  });
  document.getElementById('c12-note').innerHTML = L('紅線＝最低心跳（<55過緩），藍線＝晨收縮壓（<110偏低）。<b>兩條同時往下</b>＝藥物可能過強，慎防跌倒。', 'Merah=detak min (<55), biru=tensi pagi (<110). Keduanya turun = obat mungkin berlebih, waspada jatuh.');
  fillTable('c12', [L('日期', 'Tgl'), L('最低心跳', 'Detak min'), L('晨收縮', 'Tensi pagi')], DAYS.map(d => [dayLabel(d.date), d.has ? minHr(d) : null, d.am ? d.am.sys : null]));
}
/* ===================== ⑬ 核心 vs 末梢達標率 ===================== */
function buildC13(){
  if (!DAYS.some(d => d.overallPct != null || d.distalPct != null)) return showEmpty('c13-box', 'c13');
  mkChart('c13', {
    type: 'line',
    data: { labels: labels(), datasets: [
      lineDS(L('核心達標', 'Inti'), DAYS.map(d => d.overallPct != null ? d.overallPct : null), C.s1),
      lineDS(L('末梢達標', 'Distal'), DAYS.map(d => d.distalPct != null ? d.distalPct : null), C.s3)
    ]},
    options: {
      interaction: { mode: 'index', intersect: false },
      scales: { x: { grid: { display: false }, ticks: xTicks() }, y: { beginAtZero: true, suggestedMax: 130, grid: gridY(), title: axisTitle('%') } },
      plugins: { tooltip: { callbacks: { title: ttTitle, label: it => ' ' + fmtN(it.parsed.y) + '%　' + it.dataset.label } }, hlines: { lines: [ { y: 100, color: C.good, label: L('目標 100%', 'Target 100%') } ] } }
    }
  });
  document.getElementById('c13-note').innerHTML = L('藍線＝核心（大肌群），橙線＝末梢（手/腳掌小肌群）。<b>末梢明顯低於核心且下滑</b>，是隱性脫水/電解質的早期線索，非不夠努力。', 'Biru=inti, oranye=distal. Distal jauh di bawah inti = petunjuk awal dehidrasi/elektrolit.');
  fillTable('c13', [L('日期', 'Tgl'), L('核心 %', 'Inti %'), L('末梢 %', 'Distal %')], DAYS.map(d => [dayLabel(d.date), d.overallPct, d.distalPct]));
}
/* ===================== ⑭ 運動負荷 vs RPP ===================== */
function buildC14(){
  const rppMax = d => { const r = Math.max(d.rppAm == null ? -1 : d.rppAm, d.rppPm == null ? -1 : d.rppPm); return r < 0 ? null : r; };
  if (!DAYS.some(d => d.has && (rppMax(d) != null || d.load))) return showEmpty('c14-box', 'c14');
  mkChart('c14', {
    type: 'bar',
    data: { labels: labels(), datasets: [
      { type: 'line', label: L('最高RPP', 'RPP maks'), data: DAYS.map(d => d.has ? rppMax(d) : null), borderColor: C.crit, backgroundColor: C.crit, yAxisID: 'y', tension: 0.3, spanGaps: true, pointRadius: 2, borderWidth: 2 },
      { type: 'bar', label: L('運動負荷', 'Beban'), data: DAYS.map(d => d.has ? Math.round(d.load) : null), backgroundColor: wash(C.s2, 0.55), yAxisID: 'y1', maxBarThickness: 20, borderRadius: 3 }
    ]},
    options: {
      interaction: { mode: 'index', intersect: false },
      scales: {
        x: { grid: { display: false }, ticks: xTicks() },
        y: { position: 'left', grid: gridY(), title: axisTitle('RPP'), ticks: { callback: v => (v / 1000) + 'k' } },
        y1: { position: 'right', beginAtZero: true, grid: { display: false }, title: axisTitle(L('負荷', 'Beban')) }
      },
      plugins: { tooltip: { callbacks: { title: ttTitle } }, hlines: { lines: [ { y: RPP_DANGER, color: C.crit, label: L('危險 12k', 'Bahaya 12k') } ] } }
    }
  });
  document.getElementById('c14-note').innerHTML = L('紅線＝當日最高RPP（>12k危險），柱＝運動負荷。運動當下RPP升是正常；<b>低運動日RPP仍高</b>才是心臟本身負擔。', 'Garis=RPP maks (>12k bahaya), batang=beban. Naik saat latihan wajar; tinggi saat santai = beban jantung.');
  fillTable('c14', [L('日期', 'Tgl'), L('最高RPP', 'RPP maks'), L('運動負荷', 'Beban')], DAYS.map(d => [dayLabel(d.date), d.has && rppMax(d) != null ? Math.round(rppMax(d)) : null, d.has ? Math.round(d.load) : null]));
}
/* ===================== ⑮ 便秘連續天數 vs 攝入 ===================== */
function buildC15(){
  if (!DAYS.some(d => d.has)) return showEmpty('c15-box', 'c15');
  let g = 0; const gaps = DAYS.map(d => { if (!d.has) return null; if (d.stool === 0) g++; else g = 0; return g; });
  mkChart('c15', {
    type: 'bar',
    data: { labels: labels(), datasets: [
      { type: 'line', label: L('總攝入', 'Asupan'), data: DAYS.map(d => d.has ? d.intake : null), borderColor: C.s1, backgroundColor: C.s1, yAxisID: 'y', tension: 0.3, spanGaps: true, pointRadius: 2, borderWidth: 2 },
      { type: 'bar', label: L('連續未排便天數', 'Hari tanpa BAB'), data: gaps, backgroundColor: wash(C.s3, 0.6), yAxisID: 'y1', maxBarThickness: 20, borderRadius: 3 }
    ]},
    options: {
      interaction: { mode: 'index', intersect: false },
      scales: {
        x: { grid: { display: false }, ticks: xTicks() },
        y: { position: 'left', beginAtZero: true, suggestedMax: 1600, grid: gridY(), title: axisTitle('cc') },
        y1: { position: 'right', beginAtZero: true, suggestedMax: 5, grid: { display: false }, title: axisTitle(L('天', 'hari')), ticks: { stepSize: 1 } }
      },
      plugins: { tooltip: { callbacks: { title: ttTitle } }, hlines: { lines: [ { y: INTAKE_MIN, color: C.axis, label: L('攝入下限 1,100', 'Batas 1.100') } ] } }
    }
  });
  document.getElementById('c15-note').innerHTML = L('藍線＝當日總攝入（下限1,100），柱＝連續沒排便的天數。<b>柱越疊越高＋攝入偏低</b>＝脫水性便秘，先補水別急著加藥。', 'Garis=asupan (batas 1.100), batang=hari tanpa BAB. Batang naik + asupan rendah = sembelit dehidrasi.');
  fillTable('c15', [L('日期', 'Tgl'), L('總攝入 cc', 'Asupan'), L('連續未排便', 'Hari tanpa BAB')], DAYS.map((d, i) => [dayLabel(d.date), d.has ? fmtN(d.intake) : null, gaps[i]]));
}

function renderAll(){
  chartsAlive.forEach(ch => { try { ch.destroy(); } catch (e) {} });
  chartsAlive = [];
  renderSkeleton();
  buildC1(); buildC2(); buildC3(); buildC4(); buildC5(); buildC6(); buildC7(); buildC8(); buildC9();
  buildC10(); buildC11(); buildC12(); buildC13(); buildC14(); buildC15();
  applyInterpretations();
  applyFocus();
}

let rawByDate = {};
let SYNC = null;                        // {n, failed:[]} 最近一次同步結果（語言切換時重繪訊息用）
function renderSync(){
  const sync = document.getElementById('sync-msg');
  const chip = document.getElementById('fail-chip');
  if (!SYNC) { sync.textContent = ''; chip.style.display = 'none'; return; }
  sync.textContent = SYNC.failed.length ? '' : '✓ ' + L('已同步', 'Tersinkron') + ' ' + SYNC.n + ' ' + L('天', 'hari');
  if (SYNC.failed.length) {
    chip.style.display = 'block';
    chip.textContent = '⚠️ ' + L('以下日期讀取失敗（圖上留空）：', 'Gagal memuat tanggal berikut: ') + SYNC.failed.map(dayLabel).join('、') + L('　→ 按 🔄 重試', ' → tekan 🔄');
  } else chip.style.display = 'none';
}
async function loadAndRender(force){
  const dates = [];
  const end = new Date(RANGE.end + 'T00:00:00');
  for (let i = RANGE.days - 1; i >= 0; i--) {
    const d = new Date(end); d.setDate(d.getDate() - i);
    dates.push(new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().split('T')[0]);
  }
  const host = document.getElementById('charts');
  host.style.opacity = '.55';
  const sync = document.getElementById('sync-msg');
  document.getElementById('fail-chip').style.display = 'none';
  const { byDate, failed } = await loadRange(dates, force,
    (done, total) => { sync.textContent = '🔄 ' + L('同步中', 'Sinkronisasi') + ' ' + done + '/' + total + ' ' + L('天', 'hari'); });
  rawByDate = byDate;
  DAYS = dates.map(d => summarizeDay(d, byDate[d]));
  host.style.opacity = '1';
  SYNC = { n: dates.length, failed };
  renderSync();
  renderAll();
}

(function init(){
  cachePrune();
  const p = new URLSearchParams(location.search);
  const pd = parseInt(p.get('days'), 10);
  if ([7, 14, 30].includes(pd)) RANGE.days = pd;
  const pe = p.get('end');
  if (pe && /^\d{4}-\d{2}-\d{2}$/.test(pe)) RANGE.end = pe;
  document.getElementById('end-date').value = RANGE.end;

  document.querySelectorAll('.rangebtn').forEach(b => b.addEventListener('click', () => {
    RANGE.days = +b.dataset.days;
    const url = new URL(location); url.searchParams.set('days', RANGE.days); history.replaceState(null, '', url);
    renderChrome(); loadAndRender(false);
  }));
  document.getElementById('end-date').addEventListener('change', function(){
    if (!/^\d{4}-\d{2}-\d{2}$/.test(this.value)) return;
    RANGE.end = this.value;
    const url = new URL(location); url.searchParams.set('end', RANGE.end); history.replaceState(null, '', url);
    loadAndRender(false);
  });
  document.getElementById('refresh-btn').addEventListener('click', () => loadAndRender(true));

  renderChrome();
  renderSkeleton();          // 先畫骨架（空狀態），資料到齊後重繪
  loadAndRender(false);
})();
</script>
